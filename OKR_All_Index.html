/* ═══════════════════════════════════════════════════
   TAB 3: KPI & ตัววัดผล — รวมตัววัดผลซ้ำ + ผู้รับผิดชอบ + น้ำหนัก%
   ═══════════════════════════════════════════════════ */
var kpiSortMode = 'owners';

function renderKPI() {
  if (!D || !D.departments) return;
  var html = '<div class="section-title"><span class="icon">🎯</span> KPI &amp; ตัววัดผล — เป้าหมายและผู้รับผิดชอบ</div>';

  // Filter bar
  html += '<div class="filter-bar">';
  html += '<span class="filter-label">กรองตามกลุ่มงาน:</span>';
  html += '<select class="filter-select" id="kpiDeptFilter" onchange="filterKPI()">';
  html += '<option value="-1"' + (kpiFilterDept === -1 ? ' selected' : '') + '>ทุกกลุ่มงาน (รวม)</option>';
  D.departments.forEach(function(d, i) {
    var sel = (i === kpiFilterDept) ? ' selected' : '';
    html += '<option value="' + i + '"' + sel + '>' + esc(d.name) + '</option>';
  });
  html += '</select>';
  html += '<span class="filter-label" style="margin-left:12px">เรียงตาม:</span>';
  html += '<select class="filter-select" id="kpiSortFilter" onchange="changeKPISort()">';
  html += '<option value="owners"' + (kpiSortMode === 'owners' ? ' selected' : '') + '>จำนวนผู้รับผิดชอบ (มาก→น้อย)</option>';
  html += '<option value="type"' + (kpiSortMode === 'type' ? ' selected' : '') + '>ประเภทการเติบโต</option>';
  html += '<option value="dept"' + (kpiSortMode === 'dept' ? ' selected' : '') + '>กลุ่มงาน</option>';
  html += '</select>';
  html += '</div>';

  html += '<div id="kpiTableContainer"></div>';
  document.getElementById('section-kpi').innerHTML = html;
  renderKPITable(kpiFilterDept);
}

function filterKPI() {
  var sel = document.getElementById('kpiDeptFilter');
  if (!sel) return;
  kpiFilterDept = parseInt(sel.value);
  renderKPITable(kpiFilterDept);
}

function changeKPISort() {
  var sel = document.getElementById('kpiSortFilter');
  if (!sel) return;
  kpiSortMode = sel.value;
  renderKPITable(kpiFilterDept);
}

function renderKPITable(deptIdx) {
  var container = document.getElementById('kpiTableContainer');
  if (!container) return;

  // ── Collect all KRs from all people, filtered by dept ──
  // Deep classification: filter out non-KR items (names, labels, descriptions, meta)
  // classifyKR + normKR are now top-level functions (hoisted) — shared across all pages.
  var allKRs = [];
  D.departments.forEach(function(d, di) {
    if (deptIdx !== -1 && di !== deptIdx) return;
    var meta = getDeptMeta(d.name);
    (d.people || []).forEach(function(p) {
      (p.objectives || []).forEach(function(o) {
        (o.keyResults || []).forEach(function(kr) {
          var krText = String(kr).trim();
          if (krText.length < 4) return;
          if (/^[\d.,\s%+-]+$/.test(krText)) return;  // pure numbers

          // Classify and filter
          var krClass = classifyKR(krText);
          if (krClass === 'skip') return;

          allKRs.push({
            kr: krText,
            type: o.type || 'Other',
            person: p.name,
            team: p.team || '',
            dept: d.name,
            deptIdx: di,
            weight: o.weight || 0,
            deptColor: meta.color,
            deptBg: meta.bg,
            deptText: meta.text,
            krClass: krClass  // 'kr', 'label', 'desc'
          });
        });
      });
    });
  });

  // ── Normalize KR for grouping — deep semantic normalization ──
  // normKR is now a top-level function (hoisted) — shared across all pages.

  // ── Merge duplicates — dedup same person appearing in multiple objectives ──
  // Also merge KPI labels with their descriptions (same KR group)
  var merged = {};
  allKRs.forEach(function(k) {
    var key = normKR(k.kr);
    if (!merged[key]) {
      merged[key] = {
        krText: k.kr,
        type: k.type,
        owners: [],
        ownerSet: {},  // track unique person+dept to prevent dups
        depts: {},
        krClass: k.krClass,
        allTexts: []  // collect all text variants for picking best display
      };
    }
    // Track all text variants — prefer the longest, most descriptive one for display
    merged[key].allTexts.push(k.kr);
    // Pick best display text: longest 'kr' class text, or longest overall
    if (k.krClass === 'kr' && k.kr.length > merged[key].krText.length) {
      merged[key].krText = k.kr;
    } else if (merged[key].krClass !== 'kr' && k.krClass === 'kr') {
      merged[key].krText = k.kr;
      merged[key].krClass = 'kr';
    }
    // Dedup: only add this person once per KR group (even if KR appears in multiple objectives)
    var ownerKey = k.person + '|' + k.dept;
    if (merged[key].ownerSet[ownerKey]) return;  // already added this person for this KR
    merged[key].ownerSet[ownerKey] = true;
    merged[key].owners.push({
      person: k.person,
      team: k.team,
      dept: k.dept,
      deptIdx: k.deptIdx,
      weight: k.weight,
      deptColor: k.deptColor,
      deptBg: k.deptBg,
      deptText: k.deptText
    });
    merged[key].depts[k.dept] = (merged[key].depts[k.dept] || 0) + 1;
  });

  var mergedArr = Object.values(merged);

  // ── Sort ──
  // Sort by level: Business Growth (org/business level) → Team Growth (team level) → Personal Growth (personal) → Community
  // Then within each level, sort by owner count (most owners first)
  mergedArr.sort(function(a, b) {
    var order = { 'Business Growth': 0, 'Team Growth': 1, 'Personal Growth': 2, 'Community': 3 };
    var r = (order[a.type] || 4) - (order[b.type] || 4);
    if (r !== 0) return r;
    return b.owners.length - a.owners.length;
  });

  // ── KPI Quality Score (15-point Checklist) ──
  // Count KRs per person from allKRs (for Q14: 5-25 KRs per person)
  var personKRCount = {};
  allKRs.forEach(function(k) {
    var pk = k.person + '|' + k.dept;
    personKRCount[pk] = (personKRCount[pk] || 0) + 1;
  });
  // Average KRs per person (fallback if person not found)
  var avgKRsPerPerson = allKRs.length > 0 ? Math.round(Object.keys(personKRCount).reduce(function(s, k) { return s + personKRCount[k]; }, 0) / Object.keys(personKRCount).length) : 10;

  function scoreKR(krText, krType, hasOwner, numPersonKRs) {
    var score = 0;
    var maxScore = 15;
    var checks = [];

    // Remove prefixes for analysis
    var clean = krText.replace(/\s+/g, ' ').trim();
    for (var pi = 0; pi < 3; pi++) {
      clean = clean.replace(/^(KR\s*\d+\s*[:\.]?\s*|KPI\s*\d+\s*[:\.]?\s*|O\d+-KR\d+\s*[:\.]?\s*|\d+\s*[:\.\-)]\s*)/i, '');
    }
    clean = clean.replace(/[\(\)"]/g, '').trim();

    var hasNum = /\d/.test(clean);
    var hasUnit = /(บาท|ลบ|ล้าน|คัน|คน|%|≥|GM|CSI|SSI|คะแนน|ยอด|รายได้|กำไร|เป้าหมาย)/i.test(clean);
    var hasNumUnit = /(\d+[,\.]?\d*\s*(บาท|ลบ|ล้าน|คัน|คน|ครั้ง|%|เดือน|ปี))/i.test(clean);
    var hasAuditWord = /(รายงาน|รายการ|ยอด|สถิติ|ติดตาม|วัด|คะแนน|CSI|SSI)/i.test(clean);
    var hasThreshold = /(≥|>=|ไม่น้อยกว่า|ไม่ต่ำกว่า|เป้าหมาย|target)/i.test(clean) || hasNum;
    var hasControl = krType === 'Personal Growth' || /(ตัวเอง|ของตัวเอง|ทีม|สาขา)/i.test(clean);
    var hasAction = /(เพิ่ม|ลด|สร้าง|บรรลุ|รักษา|พัฒนา|ขยาย|ผลักดัน|ปรับ|ติดตาม|บริหาร)/i.test(clean);

    // A. Strategic Alignment (4 ข้อ)
    if (krType === 'Business Growth' || krType === 'Team Growth') { score++; checks.push('Q1✅'); } else { checks.push('Q1❌'); }
    if (hasOwner) { score++; checks.push('Q2✅'); } else { checks.push('Q2❌'); }
    if (hasNum) { score++; checks.push('Q3✅'); } else { checks.push('Q3❌'); }
    score++; checks.push('Q4✅');

    // B. KPI Quality (4 ข้อ)
    if (hasUnit) { score++; checks.push('Q5✅'); } else { checks.push('Q5❌'); }
    if (hasNumUnit) { score++; checks.push('Q6✅'); } else { checks.push('Q6❌'); }
    if (hasAuditWord) { score++; checks.push('Q7✅'); } else { checks.push('Q7❌'); }
    if (hasThreshold) { score++; checks.push('Q8✅'); } else { checks.push('Q8❌'); }

    // C. Owner & Execution (3 ข้อ)
    if (hasControl) { score++; checks.push('Q9✅'); } else { checks.push('Q9❌'); }
    if (hasOwner) { score++; checks.push('Q10✅'); } else { checks.push('Q10❌'); }
    if (hasAction) { score++; checks.push('Q11✅'); } else { checks.push('Q11❌'); }

    // D. KPI Portfolio Balance (2 ข้อ)
    score++; checks.push('Q12✅');
    if (krType === 'Business Growth' || krType === 'Team Growth' || krType === 'Personal Growth' || krType === 'Community') { score++; checks.push('Q13✅'); } else { checks.push('Q13❌'); }

    // E. KPI Quantity & Focus (2 ข้อ)
    if (numPersonKRs >= 5 && numPersonKRs <= 25) { score++; checks.push('Q14✅'); } else { checks.push('Q14❌'); }
    if (hasNum) { score++; checks.push('Q15✅'); } else { checks.push('Q15❌'); }

    // Red Flags
    var redFlags = [];
    if (!hasOwner) redFlags.push('ไม่มีเจ้าของ');
    if (!hasUnit) redFlags.push('ไม่มีสูตรคำนวณ');
    if (!hasNumUnit) redFlags.push('วัดไม่ได้จริง');
    if (krType !== 'Business Growth' && krType !== 'Team Growth' && !hasNum) redFlags.push('ไม่เชื่อมโยงองค์กร');
    if (!hasControl) redFlags.push('เจ้าของควบคุมไม่ได้');

    var grade = '';
    var gradeColor = '';
    if (score >= 13) { grade = 'Excellent'; gradeColor = '#10b981'; }
    else if (score >= 10) { grade = 'Good'; gradeColor = '#3b82f6'; }
    else if (score >= 8) { grade = 'Fair'; gradeColor = '#f59e0b'; }
    else { grade = 'ควรปรับปรุง'; gradeColor = '#ef4444'; }

    return { score: score, maxScore: maxScore, grade: grade, gradeColor: gradeColor, checks: checks, redFlags: redFlags };
  }

  // ── Compute scores for all merged KRs ──
  var allScores = [];
  mergedArr.forEach(function(m) {
    var hasOwner = m.owners.length > 0;
    // Use the first owner's KR count, fallback to average
    var numPersonKRs = avgKRsPerPerson;
    if (m.owners.length > 0) {
      var firstOwnerKey = m.owners[0].person + '|' + m.owners[0].dept;
      numPersonKRs = personKRCount[firstOwnerKey] || avgKRsPerPerson;
    }
    m.kpiScore = scoreKR(m.krText, m.type, hasOwner, numPersonKRs);
    allScores.push(m.kpiScore.score);
  });
  var avgScore = allScores.length > 0 ? (allScores.reduce(function(a, b) { return a + b; }, 0) / allScores.length) : 0;
  var avgScoreRounded = Math.round(avgScore * 10) / 10;
  var avgGrade = avgScore >= 13 ? 'Excellent' : avgScore >= 10 ? 'Good' : avgScore >= 8 ? 'Fair' : 'ควรปรับปรุง';
  var avgGradeColor = avgScore >= 13 ? '#10b981' : avgScore >= 10 ? '#3b82f6' : avgScore >= 8 ? '#f59e0b' : '#ef4444';
  var lowScoreCount = allScores.filter(function(s) { return s < 8; }).length;

  // ── Summary stats ──
  var totalUnique = mergedArr.length;
  var totalShared = mergedArr.filter(function(m) { return m.owners.length > 1; }).length;
  var totalOwners = 0;
  var ownerSet = {}; // track unique owners across all KRs
  mergedArr.forEach(function(m) { totalOwners += m.owners.length; m.owners.forEach(function(o) { ownerSet[o.person + '|' + o.dept] = true; }); });
  var totalUniqueOwners = Object.keys(ownerSet).length;

  var html = '';
  html += '<div class="card" style="margin-bottom:16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center">';
  html += '<div style="text-align:center"><div style="font-size:1.6rem;font-weight:800;color:var(--accent)">' + totalUnique + '</div><div style="font-size:0.78rem;color:var(--text2)">ตัววัดผลไม่ซ้ำ</div></div>';
  html += '<div style="width:1px;height:36px;background:var(--border)"></div>';
  html += '<div style="text-align:center"><div style="font-size:1.6rem;font-weight:800;color:var(--accent2)">' + totalShared + '</div><div style="font-size:0.78rem;color:var(--text2)">มีหลายคนรับผิดชอบ</div></div>';
  html += '<div style="width:1px;height:36px;background:var(--border)"></div>';
  html += '<div style="text-align:center"><div style="font-size:1.6rem;font-weight:800;color:var(--green)">' + totalUniqueOwners + '</div><div style="font-size:0.78rem;color:var(--text2)">ผู้รับผิดชอบ (ไม่ซ้ำ)</div></div>';
  html += '<div style="width:1px;height:36px;background:var(--border)"></div>';
  html += '<div style="text-align:center"><div style="font-size:1.6rem;font-weight:800;color:' + avgGradeColor + '">' + avgScoreRounded + '/15</div><div style="font-size:0.78rem;color:var(--text2)">KPI Quality (เฉลี่ย · ' + avgGrade + ')</div></div>';
  if (lowScoreCount > 0) {
    html += '<div style="width:1px;height:36px;background:var(--border)"></div>';
    html += '<div style="text-align:center"><div style="font-size:1.6rem;font-weight:800;color:#ef4444">' + lowScoreCount + '</div><div style="font-size:0.78rem;color:var(--text2)">KR ควรปรับปรุง (&lt;8)</div></div>';
  }
  html += '</div>';

  // ── Group merged KRs by type ──
  var types = {};
  mergedArr.forEach(function(m) {
    if (!types[m.type]) types[m.type] = [];
    types[m.type].push(m);
  });

  var typeOrder = ['Business Growth', 'Team Growth', 'Personal Growth', 'Community'];
  var typeIcons = { 'Business Growth': '💰', 'Team Growth': '👥', 'Personal Growth': '🎓', 'Community': '🤝' };
  var typeColors = { 'Business Growth': '#10b981', 'Team Growth': '#3b82f6', 'Personal Growth': '#f59e0b', 'Community': '#ec4899' };
  var typeLabels = { 'Business Growth': 'Business Growth', 'Team Growth': 'Team Growth', 'Personal Growth': 'Personal Growth', 'Community': 'Community' };

  typeOrder.forEach(function(type) {
    if (!types[type]) return;
    var krs = types[type];
    var color = typeColors[type] || '#64748b';
    var icon = typeIcons[type] || '📋';
    var label = typeLabels[type] || type;

    html += '<div class="card" style="margin-bottom:16px;border-left:4px solid ' + color + '">';
    html += '<div style="font-weight:700;font-size:0.9rem;color:' + color + ';margin-bottom:12px;display:flex;align-items:center;gap:8px">';
    html += '<span>' + icon + '</span>';
    html += '<span>' + esc(label) + '</span>';
    html += '<span style="font-size:0.78rem;color:var(--text3);font-weight:400">— ' + krs.length + ' ตัววัดผล</span>';
    html += '</div>';

    krs.forEach(function(m, idx) {
      var ownerCount = m.owners.length;
      var isShared = ownerCount > 1;
      var deptCount = Object.keys(m.depts).length;

      html += '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:' + (idx < krs.length - 1 ? '1px solid var(--border)' : 'none') + '">';
      // KR text + owner count badge
      html += '<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">';
      html += '<div style="flex:1;font-size:0.85rem;line-height:1.5;color:var(--text)">' + esc(m.krText) + '</div>';
      if (editMode) {
        var firstOwner = m.owners[0] || {};
        html += '<button onclick="editKR(' + JSON.stringify(JSON.stringify(m.krText)) + ', ' + JSON.stringify(JSON.stringify(firstOwner.person || '')) + ', ' + JSON.stringify(JSON.stringify(m.type)) + ', ' + JSON.stringify(JSON.stringify(firstOwner.dept || '')) + ')" style="flex-shrink:0;margin-left:4px;padding:2px 8px;font-size:0.72rem;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer">✏️</button>';
        html += '<button onclick="deleteKR(' + JSON.stringify(JSON.stringify(m.krText)) + ', ' + JSON.stringify(JSON.stringify(firstOwner.person || '')) + ', ' + JSON.stringify(JSON.stringify(m.type)) + ')" style="flex-shrink:0;margin-left:2px;padding:2px 8px;font-size:0.72rem;border:1px solid var(--red);border-radius:6px;background:var(--red);color:#fff;cursor:pointer">🗑️</button>';
      }
      if (isShared) {
        html += '<span style="flex-shrink:0;background:var(--accent2);color:#fff;font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:9999px;white-space:nowrap">' + ownerCount + ' คน' + (deptCount > 1 ? ' · ' + deptCount + ' กลุ่มงาน' : '') + '</span>';
      } else {
        html += '<span style="flex-shrink:0;background:var(--border);color:var(--text2);font-size:0.72rem;font-weight:600;padding:3px 10px;border-radius:9999px;white-space:nowrap">1 คน</span>';
      }
      // KPI Quality Score badge
      var ks = m.kpiScore;
      html += '<span style="flex-shrink:0;background:' + ks.gradeColor + '20;color:' + ks.gradeColor + ';border:1px solid ' + ks.gradeColor + ';font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:9999px;white-space:nowrap" title="' + ks.checks.join(' ') + '">' + ks.score + '/15 ' + ks.grade + '</span>';
      html += '</div>';
      // Red flags (if any)
      if (ks.redFlags.length > 0) {
        html += '<div style="margin-left:4px;margin-bottom:6px"><span style="background:#fef2f2;color:#dc2626;font-size:0.72rem;padding:2px 8px;border-radius:5px;font-weight:600">⚠️ ' + ks.redFlags.join(' · ') + '</span></div>';
      }
      // Owners list
      html += '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-left:4px">';
      // Sort owners by dept then name
      m.owners.sort(function(a, b) {
        if (a.dept !== b.dept) return a.dept.localeCompare(b.dept);
        return (a.person || '').localeCompare(b.person || '');
      });
      m.owners.forEach(function(o) {
        var weightStr = o.weight > 0 ? ' ' + Math.round(o.weight * 100) + '%' : '';
        html += '<span style="background:' + o.deptBg + ';color:' + o.deptText + ';font-size:0.75rem;padding:3px 8px;border-radius:6px;border:1px solid ' + o.deptColor + '20;white-space:nowrap">';
        html += esc(o.person);
        if (weightStr) html += ' <strong>' + weightStr + '</strong>';
        html += '</span>';
      });
      html += '</div>';
      html += '</div>';
    });

    html += '</div>';
    if (editMode) {
      html += '<button onclick="addKR(' + JSON.stringify(JSON.stringify(type)) + ')" style="margin:8px 0 4px;padding:6px 16px;font-size:0.78rem;border:1px solid ' + color + ';border-radius:8px;background:' + color + '20;color:' + color + ';cursor:pointer;font-weight:600">➕ เพิ่ม KR (' + esc(label) + ')</button>';
    }
  });

  // Other types
  Object.keys(types).forEach(function(type) {
    if (typeOrder.indexOf(type) !== -1) return;
    var krs = types[type];
    html += '<div class="card" style="margin-bottom:16px;border-left:4px solid #64748b">';
    html += '<div style="font-weight:700;font-size:0.9rem;color:#64748b;margin-bottom:12px">📋 ' + esc(type) + ' — ' + krs.length + ' ตัววัดผล</div>';
    krs.forEach(function(m, idx) {
      var ks2 = m.kpiScore;
      html += '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:' + (idx < krs.length - 1 ? '1px solid var(--border)' : 'none') + '">';
      html += '<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:5px">';
      html += '<div style="flex:1;font-size:0.85rem;color:var(--text)">' + esc(m.krText) + '</div>';
      if (ks2) html += '<span style="flex-shrink:0;background:' + ks2.gradeColor + '20;color:' + ks2.gradeColor + ';border:1px solid ' + ks2.gradeColor + ';font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:9999px;white-space:nowrap" title="' + ks2.checks.join(' ') + '">' + ks2.score + '/15 ' + ks2.grade + '</span>';
      html += '</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:5px">';
      m.owners.forEach(function(o) {
        html += '<span style="background:' + o.deptBg + ';color:' + o.deptText + ';font-size:0.75rem;padding:3px 8px;border-radius:6px">' + esc(o.person) + '</span>';
      });
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  if (mergedArr.length === 0) {
    html += '<div class="card"><div class="empty-placeholder">ยังไม่มีข้อมูล KR — ข้อมูลจะแสดงเมื่อบุคลากรกรอก CEO Contract ในชีทต้นทาง</div></div>';
  }

  container.innerHTML = html;
}

/* ═══════════════════════════════════════════════════
   TAB 4: Connection Map — ความเชื่อมโยง (4 ระดับ)
   ═══════════════════════════════════════════════════ */

/* ── Linkage detail modal helpers ── */

// Local normKR — mirrors the one inside renderLinkage (used for matching KR text across people)
function linkageNormKR(s) {
  var cleaned = String(s || '').replace(/\s+/g, ' ').trim();
  cleaned = cleaned.replace(/[""''']/g, '');
  for (var pi = 0; pi < 5; pi++) {
    cleaned = cleaned.replace(/^(KR\s*\d+\s*[:\.]?\s*|KRN*\s*[:\.]?\s*|O\d+-KR\d+\s*[:\.]?\s*|KPI\s*\d+\s*[:\.]?\s*|คร\s*\d+\s*[:\.]?\s*)/i, '');
    cleaned = cleaned.replace(/^\d+\s*[:\.\-)]\s*/, '');
    cleaned = cleaned.replace(/^\(\d+\)\s*/, '');
  }
  cleaned = cleaned.replace(/\([a-zA-Z\s\/\&\-]+\)/g, '');
  cleaned = cleaned.replace(/^GMของสาขา\s*/, '');
  cleaned = cleaned.replace(/servive/gi, 'service');
  cleaned = cleaned.replace(/aligement/gi, 'alignment');
  cleaned = cleaned.replace(/\s+/g, ' ').trim();
  cleaned = cleaned.replace(/[\d,]+\.?\d*/g, '#');
  cleaned = cleaned.replace(/\s+/g, ' ').trim();
  cleaned = cleaned.replace(/^#\s+/, '').replace(/\s+#$/, '');
  return cleaned.toLowerCase().substring(0, 120);
}

// Build modal HTML for a person in the linkage tab — find them across all depts by name

  var deptIdx = -1, personIdx = -1;
  for (var i = 0; i < D.departments.length; i++) {

        if (p.team !== tn) return;
        (p.objectives || []).forEach(function(o) {
          if (o.type === 'Team Growth') {
            (o.keyResults || []).forEach(function(kr) {
              var nk = normKR(kr);
              if (!teamKRs[nk]) teamKRs[nk] = { kr: kr, owners: 0, hasNum: numRe.test(String(kr)) };
              teamKRs[nk].owners++;
            });
          }
        });
      });
      var krArr = Object.values(teamKRs);
      if (krArr.length === 0) return;

      var numericTeam = krArr.filter(function(k) { return k.hasNum; });
      html += '<div style="margin-bottom:10px;padding:8px 12px;background:#f0fdf4;border-radius:6px">';
      html += '<div style="font-weight:600;font-size:0.82rem;color:var(--text);margin-bottom:4px">' + esc(d.name) + ' › ' + esc(tn) + ' (' + teams[tn] + ' คน)';
      if (numericTeam.length > 0) html += ' <span style="font-size:0.7rem;color:#059669;font-weight:600">· 🎯 ' + numericTeam.length + ' ตัวเลข</span>';
      html += '</div>';
      krArr.slice(0, 4).forEach(function(k) {
        var prefix = k.hasNum ? '🎯 ' : '';
        html += '<div style="font-size:0.78rem;color:var(--text2);padding:3px 10px;border-left:3px solid ' + meta.color + ';margin-bottom:2px">' + prefix + '<span style="cursor:pointer;color:var(--accent);text-decoration:underline" data-linkage-kr="' + esc(k.kr) + '">' + esc(k.kr) + '</span> <span style="font-size:0.72rem;color:var(--text3);cursor:pointer" data-linkage-kr="' + esc(k.kr) + '">(' + k.owners + ' คน)</span></div>';
      });
      if (krArr.length > 4) html += '<div style="font-size:0.72rem;color:var(--text3);margin-top:2px">+' + (krArr.length - 4) + ' KRs</div>';
      html += '</div>';
    });
  });
  html += '</div>';

  // ── Level 4: Personal — NCASS weights per person ──
  html += '<div class="card" style="margin-bottom:16px;border-left:4px solid #f59e0b">';
  html += '<div style="font-weight:700;font-size:0.9rem;color:#d97706;margin-bottom:8px">👤 ระดับบุคคล — NCASS (Business + Team + Personal + Community)</div>';
  html += '<div style="font-size:0.78rem;color:var(--text2);margin-bottom:10px">แต่ละคนมี 4 มิติการเติบโต พร้อมน้ำหนักการรับผิดชอบ — เชื่อมโยงกับเป้าหมายระดับทีมและธุรกิจ</div>';

  D.departments.forEach(function(d) {
    var meta = getDeptMeta(d.name);
    (d.people || []).forEach(function(p) {
      var c = countKRs(p);
      var wB = p.weightBusiness || 0, wT = p.weightTeam || 0, wP = p.weightPersonal || 0, wC = p.weightCommunity || 0;
      html += '<div style="display:inline-block;margin:3px;padding:4px 10px;background:' + meta.bg + ';border-radius:6px;border:1px solid ' + meta.color + '20;font-size:0.76rem;cursor:pointer" data-linkage-person="' + esc(p.name) + '">';
      html += '<span style="font-weight:600;color:' + meta.text + '">' + esc(p.name) + '</span>';
      html += '<span style="color:var(--text3);font-size:0.72rem"> · KR ' + c.filled + '/' + c.total + '</span>';
      if (wB > 0) html += ' <span style="font-size:0.68rem;color:#10b981;font-weight:600">B' + Math.round(wB * 100) + '%</span>';
      if (wT > 0) html += ' <span style="font-size:0.68rem;color:#3b82f6;font-weight:600">T' + Math.round(wT * 100) + '%</span>';
      if (wP > 0) html += ' <span style="font-size:0.68rem;color:#f59e0b;font-weight:600">P' + Math.round(wP * 100) + '%</span>';
      if (wC > 0) html += ' <span style="font-size:0.68rem;color:#ec4899;font-weight:600">C' + Math.round(wC * 100) + '%</span>';
      html += '</div>';
    });
  });
  html += '</div>';

  // ── Summary ──
  html += '<div class="card" style="margin-top:20px;background:linear-gradient(135deg,#dbeafe,#ede9fe);border:none">';
  html += '<div style="font-size:0.9rem;font-weight:700;color:#1e40af;margin-bottom:10px">✅ สรุป: ความสอดคล้องของตัววัดผล 4 ระดับ (พร้อมเป้าหมายเชิงตัวเลข)</div>';
  html += '<div style="font-size:0.84rem;color:var(--text2);line-height:1.8">';
  html += '<p>✅ <strong>ระดับองค์กร → ระดับธุรกิจ → ระดับทีม → ระดับบุคคล</strong> — เป้าหมายเชิงตัวเลขไหลลงจากบนสู่ล่าง สอดคล้องกันทุกระดับ</p>';
  html += '<p>🎯 <strong>CBNP Targets</strong> — PMSG 39 ลบ., PMS 29 ลบ., PMGG 9 ลบ., GM 9.5 ลบ./เดือน, GM ลูกค้าองค์กร 1 ลบ.(69)→2 ลบ.(70), รถนอก 2,500 คัน, รถเข้าซ่อม 2,900 คัน/เดือน, GM ผลิตภัณฑ์เสริม 1.8 ลบ./เดือน</p>';
  html += '<p>✅ <strong>Business Growth KRs</strong> — ตัววัดผลระดับธุรกิจ ที่มีเป้าหมายเชิงตัวเลข (เน้นด้วย 🎯)</p>';
  html += '<p>✅ <strong>Team Growth KRs</strong> — ตัววัดผลระดับทีม ขับเคลื่อนโดยทีมย่อย</p>';
  html += '<p>✅ <strong>NCASS รายบุคคล</strong> — Business + Team + Personal + Community พร้อมน้ำหนัก %</p>';
  html += '</div></div>';

  document.getElementById('section-linkage').innerHTML = html;
  
  // Event delegation: handle clicks on data-linkage-kr, data-linkage-person, data-linkage-target
  var linkageSection = document.getElementById('section-linkage');
  if (linkageSection && !linkageSection.dataset.delegated) {
    linkageSection.addEventListener('click', function(e) {
      var el = e.target;
      // Walk up to find element with data-linkage-kr or data-linkage-person or data-linkage-target
      while (el && el !== linkageSection) {
        if (el.dataset && el.dataset.linkageKr) {
          showLinkageDetail(el.dataset.linkageKr);
          return;
        }
        if (el.dataset && el.dataset.linkagePerson) {
          showLinkagePersonDetail(el.dataset.linkagePerson);
          return;
        }
        if (el.dataset && el.dataset.linkageTarget) {
          showOrgTargetDetail(el.dataset.linkageTarget);
          return;
        }
        el = el.parentElement;
      }
    });
    linkageSection.dataset.delegated = '1';
  }
}

function renderCascadeSVG() {
  if (!D || !D.departments) return '';
  var depts = D.departments;
  var n = depts.length;

  // Key CBNP target lines shown inside org box
  var orgTargetLines = [
    'CBNP PMSG 39 ลบ. | PMS 29 ลบ.',
    'PMGG 9 ลบ. | GM 9.5 ลบ./ด.',
    'GM ลูกค้าองค์กร 1→2 ลบ.',
    'รถนอก 2,500 | รถเข้า 2,900/ด.',
    'GM เสริม 1.8 ลบ./ด.'
  ];

  var numRe = /(\d[\d,]*\s*(คัน|ลบ|ล้าน|บาท|เดือน|ปี|คน|\/|%))/i;

  // Get first numeric Business Growth KR for a dept (dedup by normalized text)
  function firstNumericBizKR(dept) {
    var seen = {};
    var found = null;
    (dept.people || []).forEach(function(p) {
      if (found) return;
      (p.objectives || []).forEach(function(o) {
        if (found) return;
        if (o.type === 'Business Growth') {
          (o.keyResults || []).forEach(function(kr) {
            if (found) return;
            var nk = String(kr).trim().replace(/\s+/g, ' ').toLowerCase();
            if (seen[nk]) return;
            seen[nk] = true;
            if (numRe.test(String(kr))) found = String(kr);
          });
        }
      });
    });
    return found;
  }

  var W = 1000;
  var orgX = W / 2;
  var orgY = 20;
  var orgW = 320, orgH = 125;

  // Department (Business) level
  var bizY = 200;
  var bizW = 175, bizH = 80;
  var bizGap = (W - n * bizW) / (n + 1);
  var bizPos = [];
  for (var i = 0; i < n; i++) {
    bizPos.push({ x: bizGap + i * (bizW + bizGap), y: bizY, w: bizW, h: bizH, dept: depts[i] });
  }

  // Count teams for sizing
  var maxTeams = 0;
  depts.forEach(function(d) {
    var tc = Object.keys(deptTeams(d)).length;
    if (tc > maxTeams) maxTeams = tc;
  });

  var teamY = 330;
  var teamH = 18;
  var personY = teamY + maxTeams * (teamH + 4) + 30;

  var totalPeople = 0;
  depts.forEach(function(d) { totalPeople += (d.people || []).length; });

  var svgH = personY + 115;

  var svg = '';
  svg += '<svg width="100%" height="' + svgH + '" viewBox="0 0 ' + W + ' ' + svgH + '" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">';

  // Defs — arrow markers
  svg += '<defs>';
  depts.forEach(function(d, i) {
    var meta = getDeptMeta(d.name);
    svg += '<marker id="arr' + i + '" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="' + meta.color + '"/></marker>';
  });
  svg += '<marker id="arrOrg" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/></marker>';
  svg += '</defs>';

  // ── Level 1: Organization ──
  svg += '<rect x="' + (orgX - orgW / 2) + '" y="' + orgY + '" width="' + orgW + '" height="' + orgH + '" rx="12" fill="#3b82f6" opacity="0.95"/>';
  svg += '<text x="' + orgX + '" y="' + (orgY + 22) + '" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">PMS/PMG — องค์กร</text>';
  svg += '<text x="' + orgX + '" y="' + (orgY + 36) + '" text-anchor="middle" fill="#dbeafe" font-size="9">🎯 CBNP Targets</text>';
  orgTargetLines.forEach(function(line, li) {
    svg += '<text x="' + orgX + '" y="' + (orgY + 52 + li * 14) + '" text-anchor="middle" fill="#bfdbfe" font-size="8.5">' + esc(line) + '</text>';
  });

  // Lines from org to each department (arrows carrying targets down)
  bizPos.forEach(function(bp, i) {
    var meta = getDeptMeta(bp.dept.name);
    var cx = bp.x + bp.w / 2;
    svg += '<path d="M' + orgX + ',' + (orgY + orgH) + ' L' + orgX + ',' + (orgY + orgH + 15) + ' L' + cx + ',' + (orgY + orgH + 15) + ' L' + cx + ',' + (bp.y - 5) + '" fill="none" stroke="' + meta.color + '" stroke-width="2" marker-end="url(#arr' + i + ')"/>';
  });

  // ── Level 2: Department / Business ──
  bizPos.forEach(function(bp, i) {
    var meta = getDeptMeta(bp.dept.name);
    var s = deptStats(bp.dept);
    var cx = bp.x + bp.w / 2;
    var shortName = bp.dept.name.length > 18 ? bp.dept.name.substring(0, 16) + '..' : bp.dept.name;

    svg += '<rect x="' + bp.x + '" y="' + bp.y + '" width="' + bp.w + '" height="' + bp.h + '" rx="10" fill="' + meta.color + '" opacity="0.92"/>';
    svg += '<text x="' + cx + '" y="' + (bp.y + 18) + '" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">' + esc(shortName) + '</text>';
    svg += '<text x="' + cx + '" y="' + (bp.y + 32) + '" text-anchor="middle" fill="#fff" font-size="8.5" opacity="0.85">' + s.peopleCount + ' คน · KR ' + s.krFilled + '/' + s.krTotal + '</text>';
    // Top numeric Business Growth KR
    var topKR = firstNumericBizKR(bp.dept);
    if (topKR) {
      var krShort = topKR.length > 26 ? topKR.substring(0, 24) + '..' : topKR;
      svg += '<text x="' + cx + '" y="' + (bp.y + 46) + '" text-anchor="middle" fill="#fff" font-size="7.5" opacity="0.9">🎯 ' + esc(krShort) + '</text>';
    }
    svg += '<text x="' + cx + '" y="' + (bp.y + 62) + '" text-anchor="middle" fill="#fff" font-size="8" opacity="0.7">KPI ' + s.kpiCount + '</text>';

    // ── Level 3: Teams with Team Growth indicators ──
    var teams = deptTeams(bp.dept);
    var teamNames = Object.keys(teams);
    if (teamNames.length > 0) {
      svg += '<line x1="' + cx + '" y1="' + (bp.y + bp.h) + '" x2="' + cx + '" y2="' + (teamY - 5) + '" stroke="' + meta.color + '" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>';
      // Collect Team Growth KRs per team (deduped)
      teamNames.slice(0, 6).forEach(function(tn, ti) {
        var ty = teamY + ti * (teamH + 4);
        svg += '<rect x="' + (bp.x + 5) + '" y="' + ty + '" width="' + (bp.w - 10) + '" height="' + teamH + '" rx="5" fill="' + meta.bg + '" stroke="' + meta.color + '" stroke-width="0.8" opacity="0.9"/>';
        var tShort = tn.length > 13 ? tn.substring(0, 11) + '..' : tn;
        // Count Team Growth KRs for this team
        var teamGrowthCount = 0;
        (bp.dept.people || []).forEach(function(p) {
          if (p.team !== tn) return;
          (p.objectives || []).forEach(function(o) {
            if (o.type === 'Team Growth') {
              (o.keyResults || []).forEach(function(kr) {
                if (classifyKR(String(kr)) !== 'skip') teamGrowthCount++;
              });
            }
          });
        });
        svg += '<text x="' + cx + '" y="' + (ty + 12) + '" text-anchor="middle" fill="' + meta.text + '" font-size="8" font-weight="600">' + esc(tShort) + ' (' + teams[tn] + ')' + (teamGrowthCount > 0 ? ' · 📊' + teamGrowthCount : '') + '</text>';
      });
      if (teamNames.length > 6) {
        svg += '<text x="' + cx + '" y="' + (teamY + 6 * (teamH + 4) + 10) + '" text-anchor="middle" fill="' + meta.color + '" font-size="7.5">+' + (teamNames.length - 6) + ' ทีม</text>';
      }
    }
  });

  // ── Level labels (left side) ──
  var labelX = 10;
  svg += '<text x="' + labelX + '" y="' + (orgY + 45) + '" fill="#3b82f6" font-size="10" font-weight="700">ระดับองค์กร</text>';
  svg += '<text x="' + labelX + '" y="' + (orgY + 58) + '" fill="#94a3b8" font-size="8">Organization</text>';

  svg += '<text x="' + labelX + '" y="' + (bizY + 38) + '" fill="#8b5cf6" font-size="10" font-weight="700">ระดับธุรกิจ</text>';
  svg += '<text x="' + labelX + '" y="' + (bizY + 51) + '" fill="#94a3b8" font-size="8">Business / Dept</text>';

  svg += '<text x="' + labelX + '" y="' + (teamY - 5) + '" fill="#10b981" font-size="10" font-weight="700">ระดับทีม</text>';
  svg += '<text x="' + labelX + '" y="' + (teamY + 8) + '" fill="#94a3b8" font-size="8">Team</text>';

  svg += '<text x="' + labelX + '" y="' + (personY - 5) + '" fill="#f59e0b" font-size="10" font-weight="700">ระดับบุคคล</text>';
  svg += '<text x="' + labelX + '" y="' + (personY + 8) + '" fill="#94a3b8" font-size="8">Personal / NCASS</text>';

  // ── Level 4: Personal summary at bottom ──
  // Count unique KRs at personal level
  var personalKRCount = 0;
  var peopleWithWeights = 0;
  D.departments.forEach(function(d) {
    (d.people || []).forEach(function(p) {
      var c = countKRs(p);
      if (c.filled > 0) personalKRCount += c.filled;
      if ((p.weightBusiness || 0) + (p.weightTeam || 0) + (p.weightPersonal || 0) + (p.weightCommunity || 0) > 0) peopleWithWeights++;
    });
  });

  svg += '<rect x="' + (W / 2 - 240) + '" y="' + personY + '" width="480" height="95" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>';
  svg += '<text x="' + (W / 2) + '" y="' + (personY + 20) + '" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">👤 ระดับบุคคล — NCASS 4 มิติ</text>';
  svg += '<text x="' + (W / 2) + '" y="' + (personY + 36) + '" text-anchor="middle" fill="#a16207" font-size="9">' + totalPeople + ' คน · 📊 ' + personalKRCount + ' ตัววัดผล · ' + peopleWithWeights + ' คนมีน้ำหนัก</text>';
  svg += '<text x="' + (W / 2) + '" y="' + (personY + 50) + '" text-anchor="middle" fill="#a16207" font-size="8">Business Growth · Team Growth · Personal Growth · Community</text>';
  svg += '<text x="' + (W / 2) + '" y="' + (personY + 64) + '" text-anchor="middle" fill="#a16207" font-size="8">น้ำหนัก % ต่อมิติ → เชื่อมโยงกับเป้าหมายระดับทีมและธุรกิจ</text>';
  svg += '<text x="' + (W / 2) + '" y="' + (personY + 78) + '" text-anchor="middle" fill="#a16207" font-size="7.5" opacity="0.7">คลิกที่ชื่อบุคคลในระดับล่างเพื่อดูตัววัดผลเฉพาะบุคคล</text>';

  // Arrows from teams to personal level
  bizPos.forEach(function(bp, i) {
    var meta = getDeptMeta(bp.dept.name);
    var cx = bp.x + bp.w / 2;
    var teams = deptTeams(bp.dept);
    var teamNames = Object.keys(teams);
    var lastTeamY = teamY + Math.min(teamNames.length, 6) * (teamH + 4);
    if (teamNames.length > 0) {
      svg += '<line x1="' + cx + '" y1="' + (lastTeamY + 2) + '" x2="' + cx + '" y2="' + (personY - 3) + '" stroke="' + meta.color + '" stroke-width="1" stroke-dasharray="3,2" opacity="0.4" marker-end="url(#arr' + i + ')"/>';
    }
  });

  svg += '</svg>';
  return svg;
}


/* ═══════════════════════════════════════════════════
   TAB 5: Mentor Network

function renderMentors() {
  if (!D || !D.departments) return;
  var html = '<div class="section-title"><span class="icon">👥</span> Mentor Network</div>';

  // ── Build mentor map: mentor name → [mentees] ──
  var mentorMap = {};
  var noMentors = [];
  var totalPeople = 0;

  D.departments.forEach(function(d) {
    var meta = getDeptMeta(d.name);
    (d.people || []).forEach(function(p) {
      totalPeople++;
      var mentors = p.mentors || [];
      if (!mentors || mentors.length === 0 || (mentors.length === 1 && !mentors[0])) {
        noMentors.push({ name: p.name, dept: d.name, team: p.team || '', role: p.role || '' });
      } else {
        mentors.forEach(function(mn) {
          mn = String(mn || '').trim();
          if (!mn) return;
          if (!mentorMap[mn]) mentorMap[mn] = [];
          mentorMap[mn].push({ name: p.name, dept: d.name, team: p.team || '', role: p.role || '' });
        });
      }
    });
  });

  // ── Summary stats ──
  var totalMentees = 0;
  Object.keys(mentorMap).forEach(function(mn) { totalMentees += mentorMap[mn].length; });
  var mentorCount = Object.keys(mentorMap).length;

  html += '<div class="stat-grid">';
  html += '<div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">' + mentorCount + '</div><div class="stat-label">Mentor ทั้งหมด</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">🤝</div><div class="stat-value">' + totalMentees + '</div><div class="stat-label">Mentee ทั้งหมด</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">🚫</div><div class="stat-value" style="color:var(--red)">' + noMentors.length + '</div><div class="stat-label">ไม่มี Mentor</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value" style="color:var(--green)">' + totalPeople + '</div><div class="stat-label">บุคลากรทั้งหมด</div></div>';
  html += '</div>';

  // ── Top mentors by mentee count ──
  var mentorArr = Object.keys(mentorMap).map(function(mn) {
    return { mentor: mn, mentees: mentorMap[mn] };
  }).sort(function(a, b) { return b.mentees.length - a.mentees.length; });

  html += '<div class="card" style="margin-bottom:16px;border-left:4px solid var(--accent2)">';
  html += '<div style="font-weight:700;font-size:0.9rem;color:var(--accent2);margin-bottom:12px">🏆 Top Mentors — เรียงตามจำนวน Mentee</div>';
  html += '<div class="table-wrap"><table><thead><tr><th>#</th><th>Mentor</th><th>จำนวน Mentee</th></tr></thead><tbody>';
  mentorArr.forEach(function(m, idx) {
    html += '<tr><td>' + (idx + 1) + '</td><td style="font-weight:600">' + esc(m.mentor) + '</td><td><span style="background:var(--accent2);color:#fff;padding:2px 10px;border-radius:9999px;font-size:0.78rem;font-weight:700">' + m.mentees.length + '</span></td></tr>';
  });
  html += '</tbody></table></div>';
  html += '</div>';

  // ── Full mentor-mentee table ──
  html += '<div class="card" style="margin-bottom:16px;border-left:4px solid var(--accent)">';
  html += '<div style="font-weight:700;font-size:0.9rem;color:var(--accent);margin-bottom:12px">📋 Mentor — Mentee (รายชื่อ)</div>';
  html += '<div class="table-wrap"><table><thead><tr><th>Mentor</th><th>Mentee</th><th>กลุ่มงาน</th><th>ทีม</th></tr></thead><tbody>';
  mentorArr.forEach(function(m) {
    m.mentees.forEach(function(mee, idx) {
      var meta = getDeptMeta(mee.dept);
      html += '<tr>';
      if (idx === 0) html += '<td style="font-weight:600;vertical-align:top" rowspan="' + m.mentees.length + '">' + esc(m.mentor) + '</td>';
      html += '<td>' + esc(mee.name) + '</td>';
      html += '<td><span style="background:' + meta.bg + ';color:' + meta.text + ';padding:2px 8px;border-radius:5px;font-size:0.75rem">' + esc(mee.dept) + '</span></td>';
      html += '<td style="font-size:0.82rem;color:var(--text2)">' + esc(mee.team) + '</td>';
      html += '</tr>';
    });
  });

/* ═══════════════════════════════════════════════════
   TAB 6: Audit — ตรวจสอบความครบถ้วน
   ═══════════════════════════════════════════════════ */
function renderAudit() {
  if (!D || !D.departments) return;
  var html = '<div class="section-title"><span class="icon">🔍</span> ตรวจสอบความครบถ้วน — Comprehensive Audit</div>';

  // ── Collect data ──
  var totalPeople = 0, totalKRs = 0, krsWithoutOwners = 0, peopleWithoutMentors = 0;
  var noMentorList = [];
  var allWeightZero = [];
  var singleOwnerKRs = [];
  var noAccountability = [];

  // Use classifyKR + normKR for consistent KR counting (same as KPI page)
  var auditAllKRs = [];
  D.departments.forEach(function(d, di) {
    var meta = getDeptMeta(d.name);
    (d.people || []).forEach(function(p) {
      totalPeople++;
      var hasMentor = p.mentors && p.mentors.length > 0 && p.mentors.some(function(m) { return m && String(m).trim(); });
      if (!hasMentor) {
        peopleWithoutMentors++;
        noMentorList.push({ name: p.name, dept: d.name, team: p.team || '' });
      }
      var allZero = true;
      var hasObj = false;
      (p.objectives || []).forEach(function(o) {
        hasObj = true;
        if ((o.weight || 0) > 0) allZero = false;
        (o.keyResults || []).forEach(function(kr) {
          var krText = String(kr).trim();
          if (krText.length < 4) return;
          if (/^[\d.,\s%+-]+$/.test(krText)) return;
          var krClass = classifyKR(krText);
          if (krClass === 'skip') return;
          totalKRs++;
          auditAllKRs.push({
            kr: krText,
            type: o.type || 'Other',
            person: p.name,
            dept: d.name,
            deptIdx: di
          });
        });
      });
      if (hasObj && allZero) allWeightZero.push({ name: p.name, dept: d.name });
      if (!p.accountability || String(p.accountability).trim() === '') noAccountability.push({ name: p.name, dept: d.name });
    });
  });

  // Merge KRs using normKR (same as KPI page)
  var auditMerged = {};
  auditAllKRs.forEach(function(k) {
    var key = normKR(k.kr);
    if (!auditMerged[key]) {
      auditMerged[key] = { krText: k.kr, owners: [], type: k.type, ownerSet: {} };
    }
    var ownerKey = k.person + '|' + k.dept;
    if (auditMerged[key].ownerSet[ownerKey]) return;
    auditMerged[key].ownerSet[ownerKey] = true;
    auditMerged[key].owners.push({ person: k.person, dept: k.dept });
  });
  var auditTotalUnique = Object.keys(auditMerged).length;
  Object.values(auditMerged).forEach(function(m) {
    if (m.owners.length === 1) singleOwnerKRs.push(m);
  });

  // ── Summary stats at top ──
  html += '<div class="stat-grid">';
  html += '<div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">' + totalPeople + '</div><div class="stat-label">บุคลากรทั้งหมด</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">🎯</div><div class="stat-value" style="color:var(--green)">' + auditTotalUnique + '</div><div class="stat-label">ตัววัดผลไม่ซ้ำ</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">🔗</div><div class="stat-value" style="color:var(--accent2)">' + singleOwnerKRs.length + '</div><div class="stat-label">KRs ที่มี 1 คน</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">🚫</div><div class="stat-value" style="color:' + (peopleWithoutMentors > 0 ? 'var(--red)' : 'var(--green)') + '">' + peopleWithoutMentors + '</div><div class="stat-label">ไม่มี Mentor</div></div>';
  html += '</div>';

  // ── 2. People without mentors (red alert) ──
  html += '<div class="card" style="margin-bottom:16px;border-left:4px solid ' + (noMentorList.length > 0 ? 'var(--red)' : 'var(--green)') + '">';
  html += '<div style="font-weight:700;font-size:0.9rem;color:' + (noMentorList.length > 0 ? 'var(--red)' : 'var(--green)') + ';margin-bottom:12px">🚨 บุคลากรที่ไม่มี Mentor (' + noMentorList.length + ')</div>';
  if (noMentorList.length === 0) {
    html += '<div style="font-size:0.82rem;color:var(--green)">✅ ทุกคนมี Mentor</div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>ชื่อ</th><th>กลุ่มงาน</th><th>ทีม</th></tr></thead><tbody>';
    noMentorList.forEach(function(p) {
      html += '<tr style="background:#fef2f2"><td style="font-weight:600">' + esc(p.name) + '</td><td>' + esc(p.dept) + '</td><td>' + esc(p.team) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // ── 3. People with all objectives weight=0 (orange warning) ──
  html += '<div class="card" style="margin-bottom:16px;border-left:4px solid ' + (allWeightZero.length > 0 ? 'var(--orange)' : 'var(--green)') + '">';
  html += '<div style="font-weight:700;font-size:0.9rem;color:' + (allWeightZero.length > 0 ? 'var(--orange)' : 'var(--green)') + ';margin-bottom:12px">⚠️ บุคลากรที่น้ำหนักทุกมิติเป็น 0 (' + allWeightZero.length + ')</div>';
  if (allWeightZero.length === 0) {
    html += '<div style="font-size:0.82rem;color:var(--green)">✅ ทุกคนมีน้ำหนักอย่างน้อย 1 มิติ</div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>ชื่อ</th><th>กลุ่มงาน</th></tr></thead><tbody>';
    allWeightZero.forEach(function(p) {
      html += '<tr style="background:#fffbeb"><td style="font-weight:600">' + esc(p.name) + '</td><td>' + esc(p.dept) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // ── 4. KRs with only 1 owner (info) ──
  html += '<div class="card" style="margin-bottom:16px;border-left:4px solid var(--accent2)">';
  html += '<div style="font-weight:700;font-size:0.9rem;color:var(--accent2);margin-bottom:12px">ℹ️ KRs ที่มีผู้รับผิดชอบเพียง 1 คน (' + singleOwnerKRs.length + ') — อาจต้องการผู้รับผิดชอบเพิ่ม</div>';
  if (singleOwnerKRs.length === 0) {
    html += '<div style="font-size:0.82rem;color:var(--green)">✅ ทุก KR มีผู้รับผิดชอบมากกว่า 1 คน</div>';
  } else {
    html += '<div style="max-height:400px;overflow-y:auto">';
    html += '<div class="table-wrap"><table><thead><tr><th>KR</th><th>ประเภท</th><th>ผู้รับผิดชอบ</th></tr></thead><tbody>';
    singleOwnerKRs.forEach(function(m) {
      html += '<tr><td style="font-size:0.82rem">' + esc(m.krText.substring(0, 80)) + (m.krText.length > 80 ? '...' : '') + '</td><td style="font-size:0.78rem">' + esc(m.type) + '</td><td style="font-size:0.78rem">' + esc(m.owners[0].person) + ' (' + esc(m.owners[0].dept) + ')</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  html += '</div>';

  // ── 5. People without accountability (warning) ──
  html += '<div class="card" style="margin-bottom:16px;border-left:4px solid ' + (noAccountability.length > 0 ? 'var(--orange)' : 'var(--green)') + '">';
  html += '<div style="font-weight:700;font-size:0.9rem;color:' + (noAccountability.length > 0 ? 'var(--orange)' : 'var(--green)') + ';margin-bottom:12px">⚠️ บุคลากรที่ไม่มี Accountability (' + noAccountability.length + ')</div>';
  if (noAccountability.length === 0) {
    html += '<div style="font-size:0.82rem;color:var(--green)">✅ ทุกคนมี Accountability</div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>ชื่อ</th><th>กลุ่มงาน</th></tr></thead><tbody>';
    noAccountability.forEach(function(p) {
      html += '<tr style="background:#fffbeb"><td style="font-weight:600">' + esc(p.name) + '</td><td>' + esc(p.dept) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  document.getElementById('section-audit').innerHTML = html;
}

function showEditStatus(msg, isError) {
  var div = document.getElementById('editStatusDiv');

  div.style.background = isError ? '#fef2f2' : '#f0fdf4';

function editKR(krText, personName, type, dept) {
  var newText = prompt('แก้ไข KR:', krText);
  if (newText === null) return;
  if (newText.trim() === '') { alert('KR ไม่สามารถว่างได้'); return; }

  var payload = {
    action: 'editKR',
    sheetName: dept,
    oldKR: krText,
    newKR: newText.trim()
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success !== false) {
        showEditStatus('✅ แก้ไข KR สำเร็จ — กำลังรีโหลด...', false);
        setTimeout(function() { window.location.reload(); }, 1000);
      } else {
        showEditStatus('❌ แก้ไขไม่สำเร็จ: ' + (res ? (res.error || res.message || 'ไม่ทราบสาเหตุ') : 'ไม่มีการตอบกลับ'), true);
      }
    })
    .withFailureHandler(function(err) {
      showEditStatus('❌ ข้อผิดพลาด: ' + (err && err.message ? err.message : String(err)), true);
    })
    .gsSaveEditKR(payload);
}

function deleteKR(krText, personName, type) {
  if (!confirm('ต้องการลบ KR นี้ใช่หรือไม่?\n\n' + krText)) return;

  var payload = {
    action: 'deleteKR',

  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success !== false) {
        showEditStatus('✅ ลบ KR สำเร็จ — กำลังรีโหลด...', false);
        setTimeout(function() { window.location.reload(); }, 1000);

        showEditStatus('❌ ลบไม่สำเร็จ: ' + (res ? (res.error || res.message || 'ไม่ทราบสาเหตุ') : 'ไม่มีการตอบกลับ'), true);

    })
    .withFailureHandler(function(err) {
      showEditStatus('❌ ข้อผิดพลาด: ' + (err && err.message ? err.message : String(err)), true);
    })
    .gsSaveDeleteKR(payload);
}

function addKR(type) {
  var newText = prompt('เพิ่ม KR ใหม่สำหรับ: ' + type + '\n\nกรุณากรอกชื่อบุคคลและ KR (คั่นด้วย | )\nเช่น: สมศักดิ์ | เพิ่มยอดขาย 20%');
  if (newText === null || newText.trim() === '') return;

  var parts = newText.split('|');
  var personName = parts[0] ? parts[0].trim() : '';

  var payload = {
    action: 'addKR',

    .withSuccessHandler(function(res) {

        showEditStatus('✅ เพิ่ม KR สำเร็จ — กำลังรีโหลด...', false);
        setTimeout(function() { window.location.reload(); }, 1000);

    })
    .withFailureHandler(function(err) {
      showEditStatus('❌ ข้อผิดพลาด: ' + (err && err.message ? err.message : String(err)), true);
    })
    .gsSaveAddKR(payload);
}

/* ── Change Log Modal (5W1H) ── */
function showChangeLog() {
  var deptNames = ['PMG/PMGI', 'PMS ช่าง 4 สาขา', 'PMS ขาย', 'PMS ศูนย์บริการ', 'PMS/PMG Backoffice'];
  var pending = deptNames.length;
  var allEntries = [];

  deptNames.forEach(function(dn) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.entries) {
          res.entries.forEach(function(e) {
            allEntries.push({ dept: dn, when: e.when, who: e.who, what: e.what, where: e.where, why: e.why, how: e.how });
          });
        }
        pending--;
        if (pending === 0) renderChangeLogModal(allEntries);
      })
      .withFailureHandler(function(err) {
        pending--;
        if (pending === 0) renderChangeLogModal(allEntries);
      })
      .gsGetOKRChangeLog(dn);
  });
}

function renderChangeLogModal(entries) {
  // Remove existing modal
  var old = document.getElementById('changelogModal');
  if (old) old.remove();

  entries.sort(function(a, b) {
    var da = new Date(a.when).getTime() || 0;
    var db = new Date(b.when).getTime() || 0;
    return db - da;
  });

  var rowsHtml = '';

    rowsHtml = '<div style="padding:30px;text-align:center;color:#94a3b8;font-size:14px">ยังไม่มีบันทึกการเปลี่ยนแปลง — เมื่อมีการแก้ไข KR หรือเพิ่มแท็บใหม่ ระบบจะบันทึกอัตโนมัติ</div>';

    entries.forEach(function(e) {
      var d = e.when ? new Date(e.when) : null;
      var dateStr = d ? d.toLocaleString('th-TH') : String(e.when || '');
      var whatColor = e.what && e.what.indexOf('เพิ่ม') >= 0 ? '#10b981' : e.what && e.what.indexOf('ลบ') >= 0 ? '#ef4444' : e.what && e.what.indexOf('Error') >= 0 ? '#dc2626' : '#f59e0b';

  var modal = document.createElement('div');

  if (!section) return;
  
  section.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;font-size:14px">' +
    '<div style="font-size:32px;margin-bottom:8px">📝</div>' +
    '<div>กำลังโหลดประวัติการแก้ไข...</div></div>';
  
  var deptNames = Object.keys(CHANGELOG_DEPT_SHEETS);
  var pending = deptNames.length;
  var allEntries = [];
  
  deptNames.forEach(function(dn) {
    if (google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success && res.entries) {
            res.entries.forEach(function(e) {
              allEntries.push({ dept: dn, when: e.when, who: e.who, what: e.what, where: e.where, why: e.why, how: e.how });
            });
          }
          pending--;
          if (pending === 0) renderChangeLogContent(allEntries);
        })
        .withFailureHandler(function(err) {
          pending--;
          if (pending === 0) renderChangeLogContent(allEntries);
        })
        .gsGetOKRChangeLog(dn);
    } else {
      pending--;
      if (pending === 0) renderChangeLogContent(allEntries);
    }
  });
}

function renderChangeLogContent(entries) {
  var section = document.getElementById('section-changelog');
  if (!section) return;
  
  entries.sort(function(a, b) {
    var da = new Date(a.when).getTime() || 0;
    var db = new Date(b.when).getTime() || 0;
    return db - da;
  });
  
  // Build department filter dropdown
  var depts = ['ทุกกลุ่มงาน'].concat(Object.keys(CHANGELOG_DEPT_SHEETS));
  var filterHtml = '<select id="clFilter" onchange="filterChangeLog()" style="padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff;color:#1e293b;cursor:pointer">' +
    depts.map(function(d) { return '<option value="' + esc(d) + '">' + esc(d) + '</option>'; }).join('') +
    '</select>';
  
  // Build source sheet links
  var sheetLinksHtml = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">' +
    '<span style="font-size:12px;color:#64748b;align-self:center">🔗 ชีทต้นทาง: </span>';
  Object.keys(CHANGELOG_DEPT_SHEETS).forEach(function(dn) {
    var info = CHANGELOG_DEPT_SHEETS[dn];
    sheetLinksHtml += '<a href="https://docs.google.com/spreadsheets/d/' + info.ssid + '/edit" target="_blank" ' +
      'style="font-size:11px;padding:4px 10px;border-radius:6px;background:#eff6ff;color:#1e40af;text-decoration:none;border:1px solid #bfdbfe" ' +
      'onmouseover="this.style.background=\'#dbeafe\'" onmouseout="this.style.background=\'#eff6ff\'">' +
      '📊 ' + esc(info.label) + '</a>';
  });
  sheetLinksHtml += '</div>';
  
  var rowsHtml = '';
  if (entries.length === 0) {
    rowsHtml = '<div style="padding:40px;text-align:center;color:#94a3b8;font-size:14px">' +
      '<div style="font-size:40px;margin-bottom:12px">📋</div>' +
      '<div style="font-weight:600;color:#64748b;margin-bottom:4px">ยังไม่มีบันทึกการเปลี่ยนแปลง</div>' +
      '<div>เมื่อมีการแก้ไขข้อมูลในชีทต้นทาง ระบบจะบันทึกอัตโนมัติที่นี่ (Real-time)</div></div>';
  } else {
    entries.forEach(function(e, idx) {
      var d = e.when ? new Date(e.when) : null;
      var dateStr = d ? d.toLocaleString('th-TH') : String(e.when || '');
      var whatColor = e.what && e.what.indexOf('เพิ่ม') >= 0 ? '#10b981' : 
                      e.what && e.what.indexOf('ลบ') >= 0 ? '#ef4444' : 
                      e.what && e.what.indexOf('Error') >= 0 ? '#dc2626' : 
                      e.what && e.what.indexOf('แก้ไข') >= 0 ? '#3b82f6' : '#f59e0b';
      var whatIcon = e.what && e.what.indexOf('เพิ่ม') >= 0 ? '➕' : 
                     e.what && e.what.indexOf('ลบ') >= 0 ? '🗑️' : 
                     e.what && e.what.indexOf('แก้ไข') >= 0 ? '✏️' : 
                     e.what && e.what.indexOf('แท็บ') >= 0 ? '📑' : 'ℹ️';
      rowsHtml += '<tr class="cl-row" data-dept="' + esc(e.dept || '') + '" style="border-bottom:1px solid #e2e8f0">' +
        '<td style="padding:10px 12px;font-size:12px;color:#64748b;white-space:nowrap">' + esc(dateStr) + '</td>' +
        '<td style="padding:10px 12px;font-size:12px;font-weight:600;color:#1e293b">' + esc(e.dept || '') + '</td>' +
        '<td style="padding:10px 12px;font-size:12px;color:' + whatColor + ';font-weight:700">' + whatIcon + ' ' + esc(e.what || '') + '</td>' +
        '<td style="padding:10px 12px;font-size:12px;color:#475569;font-family:monospace">' + esc(e.where || '') + '</td>' +
        '<td style="padding:10px 12px;font-size:12px;color:#475569;font-weight:600">' + esc(e.who || '') + '</td>' +
        '<td style="padding:10px 12px;font-size:12px;color:#94a3b8;max-width:350px">' + esc(e.why || '') + '</td>' +
        '<td style="padding:10px 12px;font-size:11px;color:#94a3b8;max-width:200px">' + esc(e.how || '') + '</td>' +
      '</tr>';
    });
  }
  
  var html = '';
  
  // Hero banner
  html += '<div style="background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#2563eb 100%);color:#fff;padding:24px 28px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 20px rgba(59,130,246,0.2)">' +
    '<div style="font-size:24px;font-weight:800;margin-bottom:6px">📝 ประวัติการแก้ไข (Change Log — 5W1H)</div>' +
    '<div style="font-size:14px;opacity:.9;line-height:1.6">บันทึกการเปลี่ยนแปลงทุกครั้งที่มีการแก้ไขชีทต้นทาง — Real-time + Auto-refresh ทุก 15 นาที</div>' +
    '<div style="font-size:12px;opacity:.7;margin-top:8px">รวม ' + entries.length + ' รายการ · เรียงจากใหม่ล่าสุด</div>' +
  '</div>';
  
  // Filter + source links
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px">' +
    '<div>' + filterHtml + '</div>' +
    '<button onclick="renderChangeLogTab()" style="padding:8px 16px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff;color:#1e293b;cursor:pointer">🔄 รีเฟรช</button>' +
  '</div>';
  
  // Source sheet links
  html += sheetLinksHtml;
  
  // Table
  html += '<div class="table-wrap" style="background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)">' +
    '<table style="width:100%;border-collapse:collapse">' +
      '<thead style="position:sticky;top:0;background:#f8fafc;z-index:1">' +
        '<tr>' +
          '<th style="padding:12px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e2e8f0">When (เมื่อไหร่)</th>' +
          '<th style="padding:12px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e2e8f0">Dept (กลุ่มงาน)</th>' +
          '<th style="padding:12px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e2e8f0">What (อะไร)</th>' +
          '<th style="padding:12px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e2e8f0">Where (ที่ไหน)</th>' +
          '<th style="padding:12px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e2e8f0">Who (ใคร)</th>' +
          '<th style="padding:12px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e2e8f0">Why (ทำไม)</th>' +
          '<th style="padding:12px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e2e8f0">How (อย่างไร)</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody id="clTbody">' + rowsHtml + '</tbody>' +
    '</table>' +
  '</div>';
  
  section.innerHTML = html;
}

function filterChangeLog() {
  var filter = document.getElementById('clFilter');
  if (!filter) return;
  var val = filter.value;
  var rows = document.querySelectorAll('.cl-row');
  rows.forEach(function(r) {
    if (val === 'ทุกกลุ่มงาน' || r.getAttribute('data-dept') === val) {
      r.style.display = '';
    } else {
      r.style.display = 'none';
    }
  });
}
