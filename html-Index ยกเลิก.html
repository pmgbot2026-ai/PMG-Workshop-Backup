    function checkQuestionSortNumber(size, question_input_name, question_input_number) {
        var input_number = Number($("#" + question_input_name + "_" + question_input_number).val());
        if (input_number > size) {
            $("#" + question_input_name + "_" + question_input_number).val('');
        } else {
            for (var s = 1; s <= size; s++) {
                if (s != question_input_number) {
                    var number = $("#" + question_input_name + "_" + s).val();
                    if (number != '') {
                        if (input_number == Number(number)) {
                            $("#" + question_input_name + "_" + question_input_number).val('');
                            return;
                        }
                    }
                }
            }
        }
    }

        var functionMores = functionMore.split("=");

        var result = 0;
        for (var f = 0; f < form_choices_size; f++) {
            if (f == 0) {
                if ($("#" + form_choices[f]).val() != '') {

                    result = 0;

            }
        });
        
        
        
        
        
        
        
    }

    function onUploadFailure(error) {
        alert("อัพโหลด Error >> " + error);
    }

    function onUploadSuccess(result) {
        var url = $("#" + result.fieldname).val();
        if (url == '') {
            url = result.fileUrl;
        } else {
            url += "," + result.fileUrl;
        }
        $("#" + result.fieldname + "_groupUrl").append('&nbsp;<b><a id=""href="' + result.fileUrl + '" target="_blank">ไฟล์ที่ ' + (url.split(",").length) + '</a></b>&nbsp;');

        if (jsonDataFolder['form_upload_folder'] != undefined) {
            $("#" + result.fieldname).val("https://drive.google.com/drive/folders/" + jsonDataFolder['form_upload_folder']);
        } else {
            $("#" + result.fieldname).val(url);
        }

        $("#" + result.fieldname + "_output").html('');
    }
