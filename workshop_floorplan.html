<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบแปลนโรงซ่อม PMSG v7.0 — ตามสถานที่จริง</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f0f4f8;color:#1e293b;padding:12px}
h1{font-size:15px;color:#1e40af;text-align:center;margin-bottom:6px}
.sub{font-size:11px;color:#64748b;text-align:center;margin-bottom:8px}
canvas{display:block;margin:0 auto;border:1px solid #cbd5e1;background:#fff}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.li{display:flex;align-items:center;gap:4px;font-size:10px}
.lc{width:14px;height:14px;border:1px solid #666;border-radius:2px}
</style>
</head>
<body>
<h1>🏗️ แบบแปลนโรงซ่อม PMSG v7.0 — ตามสถานที่จริง</h1>
<div class="sub">อาคาร 20×40m · ที่ดิน 40×60m · ทิศ SW · ถนน 6 เลน · สเกล 1:100</div>
<div class="legend">
<div class="li"><div class="lc" style="background:#dbeafe"></div>รับ-ประเมิน</div>
<div class="li"><div class="lc" style="background:#cffafe"></div>ล้างรถ</div>
<div class="li"><div class="lc" style="background:#f1f5f9"></div>ผนัง/ทางเดิน</div>
<div class="li"><div class="lc" style="background:#ede9fe"></div>ตู้พ่นสี</div>
<div class="li"><div class="lc" style="background:#fef3c7"></div>คลังอะไหล่</div>
<div class="li"><div class="lc" style="background:#d1fae5"></div>ช่องซ่อมหลัง</div>
<div class="li"><div class="lc" style="background:#e2e8f0;border:2px dashed #64748b"></div>ที่ดิน</div>
</div>
<canvas id="c" width="900" height="950"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const S=15; // 1m = 15px
const BW=20*S, BD=40*S, BK=9*S; // building 300×600, back 135
const LW=40*S, LD=60*S; // land 600×900
const OX=(900-LW)/2, OY=20;

// Colors
const W='#334155', B='#e2e8f0', R='#dbeafe', P='#ede9fe', K='#fef3c7',
      G='#d1fae5', A='#cffafe', D='#fbbf24', T='#1e293b', L='#94a3b8';

function rect(x,y,w,h,fill,label,sub){
  ctx.fillStyle=fill;ctx.fillRect(OX+x,OY+y,w,h);
  ctx.strokeStyle=W;ctx.lineWidth=1.5;ctx.strokeRect(OX+x,OY+y,w,h);
  if(label){ctx.fillStyle=T;ctx.font='bold 10px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,OX+x+w/2,OY+y+h/2-(sub?6:0));
    if(sub){ctx.font='9px sans-serif';ctx.fillStyle='#475569';
      ctx.fillText(sub,OX+x+w/2,OY+y+h/2+8);}
  }
}
function wall(x,y,w,h){
  ctx.fillStyle='#cbd5e1';ctx.fillRect(OX+x,OY+y,w,h);
  ctx.strokeStyle=W;ctx.lineWidth=1;ctx.strokeRect(OX+x,OY+y,w,h);
}
function door(x,y,w,h){
  ctx.fillStyle=D;ctx.fillRect(OX+x,OY+y,w,h);
  ctx.fillStyle=T;ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('D',OX+x+w/2,OY+y+h/2);
}
function text(x,y,t,c,s,b){
  ctx.fillStyle=c||T;ctx.font=(b?'bold ':'')+(s||10)+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,OX+x,OY+y);
}
function dim(x1,y1,x2,y2,l,v){
  ctx.strokeStyle=L;ctx.lineWidth=0.5;ctx.beginPath();
  ctx.moveTo(OX+x1,OY+y1);ctx.lineTo(OX+x2,OY+y2);ctx.stroke();
  ctx.fillStyle=L;ctx.font='9px sans-serif';ctx.textAlign='center';
  if(v){ctx.save();ctx.translate(OX+x1-6,OY+(y1+y2)/2);ctx.rotate(-Math.PI/2);ctx.fillText(l,0,0);ctx.restore();}
  else{ctx.fillText(l,OX+(x1+x2)/2,OY+y1-6);}
}
function arrow(x1,y1,x2,y2,c){
  ctx.strokeStyle=c||D;ctx.lineWidth=2;ctx.setLineDash([5,3]);
  ctx.beginPath();ctx.moveTo(OX+x1,OY+y1);ctx.lineTo(OX+x2,OY+y2);ctx.stroke();
  ctx.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  ctx.beginPath();ctx.moveTo(OX+x2,OY+y2);
  ctx.lineTo(OX+x2-h*Math.cos(a-Math.PI/6),OY+y2-h*Math.sin(a-Math.PI/6));
  ctx.lineTo(OX+x2-h*Math.cos(a+Math.PI/6),OY+y2-h*Math.sin(a+Math.PI/6));
  ctx.closePath();ctx.fillStyle=c||D;ctx.fill();
}

// === DRAW ===
ctx.fillStyle='#fff';ctx.fillRect(0,0,900,950);

// Land (40×60m)
ctx.fillStyle='#f8fafc';ctx.fillRect(OX,OY,LW,LD+BK);
ctx.strokeStyle=L;ctx.lineWidth=1;ctx.setLineDash([6,4]);
ctx.strokeRect(OX,OY,LW,LD+BK);ctx.setLineDash([]);

// Road
ctx.fillStyle='#e2e8f0';ctx.fillRect(OX-25,OY+LD+BK+5,LW+50,20);
text(LW/2,LD+BK+17,'🛣️ ถนน 6 เลน (SW)',L,9,true);

// Back area (40×9m)
rect(0,0,LW,BK,K,'📦 ห้องเก็บอะไหล่','ฝ้าสูง 2 ชั้น · ประตูตาข่ายเลื่อน 2m');

// === BUILDING (20×40m) centered in land ===
const bx=(LW-BW)/2, by=BK+10;
ctx.fillStyle='#f1f5f9';ctx.fillRect(OX+bx,OY+by,BW,BD);
ctx.strokeStyle=W;ctx.lineWidth=2.5;ctx.strokeRect(OX+bx,OY+by,BW,BD);
text(bx+BW/2,by-8,'🏢 อาคาร 20×40m',L,9,true);

// === INTERIOR LAYOUT (from Excel grid) ===
// Building interior: 20m wide, 40m deep
// Section 1 (Y=1-4m): Reception + Wash — 4m deep
// Wall (Y=5-15m): Structure/wall — 10m
// Section 2 (Y=16-30m): Access/structure — 15m
// Section 3 (Y=31-44m): Paint + work — 14m
// Section 4 (Y=45-48m): Back bays — 4m (extends into back area)

const ix=bx+2, iy=by+2, iw=BW-4, ih=BD-4;

// --- SECTION 1: Reception + Wash (Y=1-4m = 4m deep) ---
const s1h=4*S;
// 4 reception bays (each ~4m wide)
const bayW=iw/5; // 4 bays + 1 wash
rect(ix,iy,bayW,s1h,R,'📋 ประเมิน','①');
rect(ix+bayW,iy,bayW,s1h,R,'🚗 รับรถ','②');
rect(ix+bayW*2,iy,bayW,s1h,R,'🚗 รับรถ','③');
rect(ix+bayW*3,iy,bayW,s1h,R,'📤 ส่งมอบ','④');
// Wash area (2m wide at right)
rect(ix+bayW*4,iy,bayW*0.5,s1h,A,'💦 ล้าง','⑤');

// --- WALL (Y=5-15m = 10m) ---
const s2y=iy+s1h, s2h=10*S;
wall(ix,s2y,iw,s2h);
text(ix+iw/2,s2y+s2h/2,'🧱 ผนัง/โครงสร้าง (10m)','#64748b',9,true);

// --- SECTION 2: Access area (Y=16-30m = 15m) ---
const s3y=s2y+s2h, s3h=15*S;
// This area has doors and access
wall(ix,s3y,iw*0.3,s3h); // left wall
// Door opening
door(ix+iw*0.3,s3y+5*S,iw*0.1,s3h-5*S);
// Open area (drive aisle)
ctx.fillStyle='#f8fafc';ctx.fillRect(OX+ix+iw*0.4,OY+s3y,iw*0.4,s3h);
ctx.strokeStyle=L;ctx.lineWidth=0.5;ctx.setLineDash([3,2]);
ctx.strokeRect(OX+ix+iw*0.4,OY+s3y,iw*0.4,s3h);ctx.setLineDash([]);
text(ix+iw*0.6,s3y+s3h/2,'🛣️ ทางเดินรถ','กลางอาคาร',L,9,true);
// Right wall
wall(ix+iw*0.8,s3y,iw*0.2,s3h);

// Flow arrow through aisle
arrow(ix+iw*0.6,s3y+10,ix+iw*0.6,s3y+s3h-10,'#16a34a');

// --- SECTION 3: Paint + Work (Y=31-44m = 14m) ---
const s4y=s3y+s3h, s4h=14*S;
// Paint booth (12m wide × 14m deep)
rect(ix,s4y,12*S,s4h,P,'🎨 ตู้พ่นสี','12×14m · Comax/PPG');
// Parts storage (0.5m strip on left wall — already in wall)
// Right side: structure/wall
wall(ix+12*S,s4y,iw-12*S,s4h);
text(ix+12*S+(iw-12*S)/2,s4y+s4h/2,'🧱 ผนัง','#64748b',8,true);

// --- SECTION 4: Back bays (Y=45-48m = 4m, extends into back area) ---
const s5y=s4y+s4h, s5h=4*S;
rect(ix,s5y,12*S,s5h,G,'🔧 ช่องซ่อมหลัง','⑥ ⑦ ⑧ ⑨');
wall(ix+12*S,s5y,iw-12*S,s5h);

// === EXTERIOR: Service area (right of building) ===
const svX=bx+BW+10;
if(svX+8*S<LW-5){
  // EV charging
  for(let i=0;i<3;i++)rect(svX+i*3*S,by,3*S,4*S,'#f3e8ff','⚡','EV'+(i+1));
  // Service bays
  for(let c=0;c<2;c++)for(let r=0;r<4;r++){
    const sx=svX+c*(4*S+3),sy=by+5*S+r*(7*S+3);
    if(sx+4*S<LW-5&&sy+7*S<by+BD)rect(sx,sy,4*S,7*S,'#fce7f3','🔧 S'+(c*4+r+1));
  }
  text(svX+4*S,by-8,'🔧 บริการ(8)+EV(3)','#be185d',8,true);
}

// === EXTERIOR: Coating (left of building) ===
const coX=bx-10-8*S;
if(coX>5){
  rect(coX,by,4*S,7*S,'#ffedd5','✨ C1','เตรียม');
  rect(coX+4*S+2,by,4*S,7*S,'#ffedd5','✨ C2','เตรียม');
  rect(coX,by+7*S+4,4*S,7*S,'#ffedd5','💎 C3','เคลือบ');
  rect(coX+4*S+2,by+7*S+4,4*S,7*S,'#ffedd5','💎 C4','ฟิล์ม');
  text(coX+4*S,by-8,'💎 เคลือบ/ฟิล์ม(4)','#9a3412',8,true);
}

// === PARKING (front, between building and road) ===
const pkY=by+BD+8;
for(let i=0;i<5;i++){
  ctx.fillStyle='#f1f5f9';ctx.fillRect(OX+5+i*(5*S+3),OY+pkY,5*S,4*S);
  ctx.strokeStyle=L;ctx.lineWidth=0.5;ctx.setLineDash([3,2]);
  ctx.strokeRect(OX+5+i*(5*S+3),OY+pkY,5*S,4*S);ctx.setLineDash([]);
  text(5+i*(5*S+3)+2.5*S,pkY+2*S,'🚛 H'+(i+1),L,8,true);
}
text(LW/2,pkY-6,'🚗 จอดรถ รอซ่อม (5 รถหนัก)',L,8,true);

// === DIMENSIONS ===
dim(0,by+BD+4,LW,by+BD+4,'40m ที่ดิน');
dim(-8,by,-8,by+BD,'40m อาคาร',true);
dim(-8,0,-8,LD+BK,'69m (60+9)',true);
dim(bx,by+BD+4,bx+BW,by+BD+4,'20m อาคาร');
dim(bx,by-4,bx+BW,by-4,'20m');
dim(ix,s4y-4,ix+12*S,s4y-4,'12m ตู้พ่นสี');

// === COMPASS ===
ctx.save();ctx.translate(OX+LW-20,OY+20);
ctx.fillStyle='#fbbf24';ctx.font='bold 10px sans-serif';
ctx.textAlign='center';ctx.fillText('SW ↘',0,0);ctx.restore();
</script>
</body>
</html>
