<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b;padding:16px}
.s-header{background:linear-gradient(135deg,#0f172a,#1e3a5f,#2563eb);color:#fff;padding:20px;border-radius:12px;margin-bottom:16px}
.s-header h1{font-size:22px;margin-bottom:4px}
.s-header p{font-size:13px;opacity:.8}
.s-obj{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.s-obj-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.s-badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:6px;color:#fff}
.kr-item{padding:10px 12px;background:#f8fafc;border-radius:8px;margin-bottom:8px;border-left:4px solid #e2e8f0}
.kr-text{font-size:15px;color:#475569}
.kr-result{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.kr-actual{font-size:15px;font-weight:700}
.kr-target{font-size:13px;color:#94a3b8}
.kr-bar{flex:1;min-width:80px;height:10px;background:#e2e8f0;border-radius:9999px;overflow:hidden}
.kr-bar-fill{height:100%;border-radius:9999px}
.kr-pct{font-size:16px;font-weight:700;min-width:60px;text-align:right}
.kr-status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.kr-links{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.kr-links a{font-size:12px;text-decoration:none;font-weight:600;padding:2px 8px;border-radius:4px}
.link-dash{color:#3b82f6}.link-sheet{color:#059669}
</style>
</head>
