<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PP7 Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Prompt","Sarabun","Segoe UI",Tahoma,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a5f,#667eea);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:16px;padding:40px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{font-size:26px;color:#667eea;text-align:center;margin-bottom:8px}
.login-box p{text-align:center;color:#64748b;margin-bottom:24px;font-size:15px}
.login-box input{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:17px;margin-bottom:12px;font-family:inherit}
.login-box input:focus{border-color:#667eea;outline:none}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px}
.emoji{text-align:center;font-size:48px;margin-bottom:16px}
</style></head><body>
<div class="login-box">
<div class="emoji">🔒</div>
<h1>PP7 Recruitment</h1>
<p>ระบบรับสมัครงาน PKG Group</p>
<form action="__SCRIPT_URL__" method="GET">
<input type="hidden" name="pp7" value="1">
<input type="hidden" name="pwdok" value="1">
<input type="password" name="pass" placeholder="รหัสผ่าน" required>
<input type="text" name="otp" placeholder="รหัส 2FA" required>
<button type="submit">เข้าสู่ระบบ</button>
</form>
</div>
</body></html>
