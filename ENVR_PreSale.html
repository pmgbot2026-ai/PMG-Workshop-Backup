<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แจ้งขายน้ำมัน (ก่อนขาย) | ENVR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 800; color: #2dd4bf; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 6px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 11px; font-size: 16px; background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 10px; outline: none; }
  input:focus, select:focus { border-color: #2dd4bf; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .total { margin-top: 14px; padding: 12px; background: #134e4a; border-radius: 10px; font-size: 17px; font-weight: 800; color: #5eead4; text-align: center; }
  button { width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; font-weight: 800; background: #10b981; color: #fff; border: 0; border-radius: 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 14px; display: none; }
  .ok { background: #064e3b; color: #6ee7b7; display: block; }
  .err { background: #7f1d1d; color: #fecaca; display: block; }
  .list { margin-top: 20px; }
  .list h2 { font-size: 15px; color: #94a3b8; margin-bottom: 10px; }
  .item { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; line-height: 1.7; }
  .st { float: right; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; }
  .st.wait { background: #78350f; color: #fcd34d; }
  .st.ok { background: #065f46; color: #6ee7b7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📢 แจ้งขายน้ำมัน (ก่อนขาย)</h1>
  <div class="sub">กรอกรายละเอียดก่อนขาย → ระบบส่งแจ้ง Telegram ให้พี่กดยืนยัน → ค่อยคีย์ฟอร์มขายจริง (environSell) เมื่อขายได้</div>

  <div class="card">
    <label>🛢 ประเภทน้ำมัน</label>
    <select id="oil"><option>เลือก…</option></select>
    <label>📍 แหล่งที่เก็บ</label>
    <select id="storage"><option>เลือก…</option></select>
    <div class="row2">
      <div><label>💧 จำนวน (ลิตร)</label><input id="liter" type="number" step="0.01" min="0" inputmode="decimal" placeholder="เช่น 3500"></div>
      <div><label>💰 ราคา/ลิตร (บาท)</label><input id="price" type="number" step="0.01" min="0" inputmode="decimal" placeholder="เช่น 22"></div>
    </div>
    <div class="total" id="total">ยอดรวม 0 บาท</div>
    <label>👤 ลูกค้า / หน่วยงาน</label>
    <input id="customer" type="text" placeholder="ชื่อลูกค้า">
    <label>📞 เบอร์ลูกค้า</label>
    <input id="tel" type="tel" inputmode="tel" placeholder="เช่น 08x-xxx-xxxx">
    <label>📝 หมายเหตุ (ถ้ามี)</label>
    <input id="note" type="text" placeholder="รายละเอียดเพิ่มเติม">
    <button id="btn" onclick="submit()">📤 ส่งแจ้งขาย → Telegram</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="list">
    <h2>📋 รายการแจ้งขายล่าสุด</h2>
    <div id="list">กำลังโหลด…</div>
  </div>
</div>
<script>
  var OILS = ['น้ำมันเอนกประสงค์', 'น้ำมันเครื่อง', 'น้ำมันไฮดรอลิค', 'น้ำมันเกียร์', 'น้ำมันเบรก', 'น้ำมันหล่อเย็น'];
  var STORES = ['บ่อ 1', 'บ่อ 2', 'บ่อ 3', 'ถังใหญ่', 'ถังย่อย'];
  (function init() {
    var s1 = document.getElementById('oil'), s2 = document.getElementById('storage');
    OILS.forEach(function (o) { var op = document.createElement('option'); op.value = o; op.textContent = o; s1.appendChild(op); });
    STORES.forEach(function (o) { var op = document.createElement('option'); op.value = o; op.textContent = o; s2.appendChild(op); });
    ['liter', 'price'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', calc);
    });
    loadList();
  })();
  function calc() {
    var l = parseFloat(document.getElementById('liter').value) || 0;
    var p = parseFloat(document.getElementById('price').value) || 0;
    var t = Math.round(l * p * 100) / 100;
    document.getElementById('total').textContent = 'ยอดรวม ' + t.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' บาท';
  }
  function submit() {
    var d = {
      oil: val('oil'), storage: val('storage'),
      liter: parseFloat(val('liter')) || 0, price: parseFloat(val('price')) || 0,
      customer: val('customer'), tel: val('tel'), note: val('note'), by: 'ENVR Web'
    };
    if (!d.oil || !d.storage || d.liter <= 0 || d.price <= 0) { show('err', '⚠️ กรอกให้ครบ: น้ำมัน · แหล่งเก็บ · จำนวน · ราคา'); return; }
    var b = document.getElementById('btn');
    b.disabled = true; b.textContent = 'กำลังส่ง…';
    show('err', '');
    google.script.run
      .withSuccessHandler(function (r) {
        b.disabled = false; b.textContent = '📤 ส่งแจ้งขาย → Telegram';
        if (r && r.ok) {
          show('ok', '✅ ส่งแจ้งแล้ว (อ้างอิง ' + r.key + ') — รอพี่กดยืนยันใน Telegram ยอดรวม ' + (r.total || 0).toLocaleString('en-US') + ' บาท');
          clearForm(); loadList();
        } else { show('err', '❌ ผิดพลาด: ' + ((r && r.err) || 'ไม่ทราบสาเหตุ')); }
      })
      .withFailureHandler(function (e) {
        b.disabled = false; b.textContent = '📤 ส่งแจ้งขาย → Telegram';
        show('err', '❌ เชื่อมต่อไม่ได้: ' + e);
      })
      .envrPreSaleSubmit(d);
  }
  function loadList() {
    google.script.run.withSuccessHandler(function (rows) {
      var el = document.getElementById('list');
      if (!rows || !rows.length) { el.textContent = '— ยังไม่มีรายการ —'; return; }
      el.innerHTML = rows.map(function (r) {
        var st = r.status === 'ยืนยันแล้ว' ? '<span class="st ok">✅ ยืนยันแล้ว</span>' : '<span class="st wait">⏳ รอยืนยัน</span>';
        return '<div class="item">' + st + '<b>' + esc(r.key) + '</b> · ' + esc(r.time) + '<br>🛢 ' + esc(r.oil) + ' · 💧 ' + num(r.liter) + ' ลิตร · 💰 ' + num(r.total) + ' บาท<br>👤 ' + esc(r.customer) + (r.tel ? ' 📞 ' + esc(r.tel) : '') + '</div>';
      }).join('');
    }).withFailureHandler(function () { document.getElementById('list').textContent = 'โหลดรายการไม่ได้'; }).envrPreSaleList();
  }
  function val(id) { return (document.getElementById(id).value || '').trim(); }
  function clearForm() { ['liter', 'price', 'customer', 'tel', 'note'].forEach(function (id) { document.getElementById(id).value = ''; }); calc(); }
  function show(cls, t) { var m = document.getElementById('msg'); m.className = 'msg ' + cls; m.textContent = t; }
  function num(n) { return (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
</script>
</body>
</html>
