<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--card:#fff;--border:#e2e8f0;--text:#1e293b;--dim:#64748b;--accent:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316;--purple:#8b5cf6;--header-bg:linear-gradient(135deg,#1a1f2e,#0d1117)}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;font-size:14px}
.header{background:var(--header-bg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{color:#fff;font-size:18px;margin:0}
.header .date{color:rgba(255,255,255,.7);font-size:12px}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);overflow-x:auto;flex-wrap:nowrap}
.tab{padding:8px 12px;cursor:pointer;color:var(--dim);border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;font-size:12px;font-weight:500}
.tab:hover{color:var(--accent);background:#f0f4ff}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#f0f4ff;font-weight:600}
.content{max-width:1200px;margin:0 auto;padding:10px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:14px;font-weight:600;color:#0f3460;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #e8ecf1}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:8px;padding:10px;text-align:center;border:1px solid #e2e8f0}
.kpi .val{font-size:1.3rem;font-weight:700;line-height:1.2}
.kpi .lbl{font-size:.7rem;color:var(--dim);margin-top:2px}
.kpi .pct{font-size:.75rem;margin-top:2px}
.kpi .pct.g{color:var(--green)}.kpi .pct.r{color:var(--red)}.kpi .pct.y{color:var(--yellow)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.charts{grid-template-columns:1fr}}
.chart-box{position:relative;height:260px;margin-bottom:6px}
.chart-box.lg{height:300px}
table{width:100%;border-collapse:collapse;font-size:.72rem}
th{background:#f0f4ff;color:#0f3460;text-align:center;padding:5px 6px;position:sticky;top:0;z-index:1;font-weight:500}
th:first-child,td:first-child{text-align:left;font-weight:500}
td{padding:4px 6px;text-align:center;border-bottom:1px solid #f1f5f9}
tr:hover td{background:#f8fafc}
tr.sub td{font-weight:600;color:#0f3460;background:#f0f4ff}
td.g{color:var(--green);font-weight:600}
td.r{color:var(--red);font-weight:600}
td.y{color:var(--yellow);font-weight:600}
select{padding:4px 8px;border-radius:6px;border:1px solid #d1d5db;font-family:'Segoe UI',Tahoma,sans-serif;font-size:.8rem;background:#fff;color:var(--text)}
.sel-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.err{background:#ef4444;color:#fff;padding:10px 14px;border-radius:6px;display:none;margin:8px 0;font-size:14px;font-weight:bold;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(239,68,68,.4)}
.up{color:var(--green)}.dn{color:var(--red)}
.loading{text-align:center;padding:40px;color:var(--dim);font-size:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600;color:#fff;vertical-align:middle;margin-left:6px}
.badge-blue{background:var(--accent)}.badge-green{background:var(--green)}.badge-red{background:var(--red)}.badge-orange{background:var(--orange)}
.fbtn{padding:6px 14px;border-radius:6px;font-size:.78rem;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;transition:all .15s}
.fbtn:hover{background:#f0f4ff;border-color:var(--accent)}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:768px){.kpi-row{grid-template-columns:1fr 1fr}.chart-box{height:220px}}
/* Summary tab */
.summary-date-toggle{display:flex;gap:8px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
.summary-date-btn{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;border:1.5px solid #d1d5db;background:#fff;color:#64748b;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.summary-date-btn:hover{background:#eff6ff;color:#3b82f6;border-color:#3b82f6}
.summary-date-btn.active{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border-color:#7c3aed;box-shadow:0 2px 8px rgba(124,58,237,.3)}
.summary-card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px;overflow:hidden}
.summary-card-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.summary-card-header h3{font-size:.88rem;margin:0;display:flex;align-items:center;gap:6px}

.summary-row:last-child{border-bottom:none}
.summary-row .tech{font-weight:700;color:#3b82f6;min-width:60px;font-size:.8rem}
.summary-row .plates{color:#1e293b;flex:1;font-size:.78rem}

.summary-empty{text-align:center;padding:18px;color:#94a3b8;font-size:.85rem}
.summary-target{display:inline-block;background:#dbeafe;color:#3b82f6;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.summary-below{display:inline-block;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.summary-above{display:inline-block;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.summary-on{display:inline-block;background:#dbeafe;color:#3b82f6;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.summary-month{background:#fff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px;overflow:hidden}
.summary-month-header{padding:10px 14px;background:#f0f4ff;border-bottom:1px solid #e2e8f0}
.summary-month-header h3{font-size:.88rem;margin:0;color:#0f3460}
/* Brief tab */
.brief-section{background:#fff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px;overflow:hidden}
.brief-section-hdr{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e2e8f0;background:#f0f4ff;font-weight:700;font-size:.9rem;color:#1e293b}
.brief-section-hdr .emoji{font-size:1.1rem}
.brief-row{display:flex;align-items:baseline;padding:6px 14px;border-bottom:1px solid #f1f5f9;font-size:.82rem;line-height:1.5}
.brief-row:last-child{border-bottom:none}
.brief-row .label{color:#64748b;min-width:110px;font-weight:600;flex-shrink:0}
.brief-row .value{color:#1e293b;flex:1}
.brief-row .pct{font-weight:600;margin-left:6px}
.brief-row .pct.good{color:#10b981}
.brief-row .pct.warn{color:#f59e0b}
.brief-row .pct.bad{color:#ef4444}
.brief-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px}
.brief-kpi-item{background:#f8fafc;border-radius:8px;padding:8px 10px;text-align:center}
.brief-kpi-item .num{font-size:1.3rem;font-weight:800;color:#1e293b;display:block}
.brief-kpi-item .lbl{font-size:.68rem;color:#94a3b8;display:block;margin-top:2px}
.brief-kpi-item .sub{font-size:.72rem;color:#64748b;font-weight:600}
.brief-rank{display:flex;align-items:center;padding:5px 14px;font-size:.82rem}
.brief-rank .rank{width:22px;font-weight:700;color:#94a3b8;text-align:center;flex-shrink:0}
.brief-rank .name{flex:1;color:#1e293b;font-weight:600}
.brief-rank .val{color:#3b82f6;font-weight:700;min-width:50px;text-align:right}
.brief-rank .extra{color:#94a3b8;font-size:.72rem;margin-left:6px}
.brief-product{display:flex;align-items:center;padding:4px 14px;font-size:.8rem}
.brief-product .pname{color:#64748b;min-width:120px}
.brief-product .pval{color:#1e293b;font-weight:600}
.brief-bar-container{height:6px;background:#e2e8f0;border-radius:3px;margin:4px 0;overflow:hidden}
.brief-bar-fill{height:100%;border-radius:3px;transition:width .3s}
</style>
</head>

<script>
/* ═══════════ Global Error Catcher ═══════════ */
window.onerror=function(msg,url,line,col,err){
  var p=document.getElementById('errPanel');
  if(p){p.textContent+=(p.textContent?' | ':'')+'JS Error: '+msg+' (line '+line+')';p.style.display='block';}
  var el=document.getElementById('loadMsg');
  if(el){el.innerHTML='<div style="font-size:20px;color:#ef4444;padding:20px">❌ เกิดข้อผิดพลาด: '+msg+' (line '+line+')</div><div style="margin-top:8px"><a href="javascript:location.reload()" style="color:#3b82f6;text-decoration:underline;font-weight:bold;font-size:16px">🔄 กดเพื่อรีเฟรช</a></div>';}
  return false;
};
window.addEventListener('unhandledrejection',function(e){
  var p=document.getElementById('errPanel');
  if(p){p.textContent+=(p.textContent?' | ':'')+'Promise Error: '+e.reason;p.style.display='block';}
});
/* ═══════════ Globals ═══════════ */
if(typeof ChartDataLabels!=="undefined"){Chart.register(ChartDataLabels);}
var D={};
var charts={};
var loaded=0;
var totalToLoad=17;
var currentYear=69;
var loadNames=['OKR/KPI','ปิดได้/ส่งมอบ','การเงิน','ประกันภัย','ช่องทาง','SA','เชียร์เคลม','YoY','DTA','ข้อมูลย้อนหลัง','ประเภทซ่อม','Service Mix','ผลิตภัณฑ์เสริม','Monitor','เคลือบแก้ว','ปฏิทินสรุป','เปรียบเทียบประกัน'];

function showErr(m){var p=document.getElementById('errPanel');p.textContent+=(p.textContent?' | ':'')+m;p.style.display='block';}
function fmt(n){if(n==null||isNaN(n))return'-';return Math.round(n).toLocaleString('th-TH');}
function fmtB(n){if(n==null||isNaN(n))return'-';var a=Math.abs(n);var s=n<0?'-':'';if(a>=1e6)return s+(a/1e6).toFixed(1)+'ล้าน';if(a>=1e5)return s+(a/1e5).toFixed(2)+'แสน';if(a>=1e4)return s+(a/1e4).toFixed(1)+'หมื่น';if(a>=1e3)return s+(a/1e3).toFixed(1)+'พัน';return fmt(n);}
function pctC(p){return p>=100?'g':p>=80?'y':'r';}
function pctS(p,t){return'<span class="pct '+pctC(p)+'">'+(t||p.toFixed(1)+'%')+'</span>';}

/* ═══════════ Chart Helper ═══════════ */
function mkC(id,cfg){
  if(charts[id])charts[id].destroy();
  var el=document.getElementById(id);if(!el)return null;
  /* Inject layout.padding so top datalabels are never clipped */
  if(!cfg.options)cfg.options={};
  if(!cfg.options.layout)cfg.options.layout={};
  cfg.options.layout.padding={top:34,right:8,bottom:4,left:4};
  charts[id]=new Chart(el,cfg);return charts[id];
}
function barDS(label,data,color,border){return{label:label,data:data,backgroundColor:color,borderColor:border||color,borderWidth:1};}
function lineDS(label,data,color,dash,w){return{label:label,data:data,borderColor:color,borderWidth:w||2,borderDash:dash||[],fill:false,tension:.3,pointRadius:dash?0:2};}
/* ═══ Datalabel: WHITE bold text on dark pill, BLACK outline, Caja-safe ═══
   - Proven working in GAS/Caja since v13.37
   - textStrokeWidth=4 guarantees readability even if Caja strips backgroundColor
   - layout.padding:{top:34} on every chart prevents top labels from being clipped
   - clamp=true keeps labels inside chart area when bars are very tall
   - v13.58: fontSize 16→14 still visible, strong pill bg, high contrast */
function dlCfg(show,fmtFn,opts){
  var o=opts||{};
  return{datalabels:{
    display:show!==false,
    formatter:fmtFn||function(v){return v?fmt(v):'';},
    color:o.color||'#FFFFFF',
    anchor:o.anchor||'end',
    align:o.align||'top',
    clamp:o.clamp!==undefined?o.clamp:true,
    font:{size:o.fontSize||14,weight:o.fontWeight||'bold'},
    textStrokeColor:o.textStrokeColor||'#000',
    textStrokeWidth:o.textStrokeWidth||4,
    backgroundColor:o.bgColor||'rgba(0,0,0,0.82)',
    borderRadius:6,
    padding:{top:4,left:8,right:8,bottom:4}
  }};
}
function dlHide(){return{datalabels:{display:false}};}
/* ═══ Datalabel: Thin — dark bold text, white outline, NO pill bg. Better for dense charts ═══
   v13.58: improved readability — thicker white outline, larger font */
function dlCfgThin(show,fmtFn,opts){
  var o=opts||{};
  return{datalabels:{
    display:show!==false,
    formatter:fmtFn||function(v){return v?fmt(v):'';},
    color:o.color||'#0f172a',
    anchor:o.anchor||'end',
    align:o.align||'top',
    clamp:o.clamp!==undefined?o.clamp:true,
    font:{size:o.fontSize||14,weight:o.fontWeight||'bold'},
    textStrokeColor:o.textStrokeColor||'#ffffff',
    textStrokeWidth:o.textStrokeWidth||4,
    backgroundColor:null,
    borderRadius:0,
    padding:3
  }};
}

/* ═══════════ Year Helper ═══════════ */
var FALLBACK_YEARS=[67,68,69];
function getYearLabels(){
  var yoy=D.yoy;
  if(!yoy||!yoy.yearHeaders||!yoy.yearHeaders.length){
    return FALLBACK_YEARS.map(function(t){return{christian:t-543+2000,thai:t,label:'ปี '+t};});
  }
  return yoy.yearHeaders.map(function(y){return{christian:y,thai:(y+543)%100,label:'ปี '+(y+543)%100};});
}
function getYearFromThai(thai){var yoy=D.yoy;var headers=(yoy&&yoy.yearHeaders&&yoy.yearHeaders.length)?yoy.yearHeaders:FALLBACK_YEARS.map(function(t){return t-543+2000;});var m=headers.filter(function(y){return(y+543)%100===thai;});return m.length?m[0]:(thai-543+2000);}

/* ═══════════ Load Data — via google.script.run ═══════════ */
function loadData(){
  var fns=['getOKRData','getBCTData','getFinData','getInsData','getChData','getSAData','getShareClaimData','getYoYData','getDTAData','getHistoricalData','getRepairTypeData','getServiceMixData','getSupplementData','getMonitorData','getGlassData','getCalendarData','getInsuranceComparison'];
  var keys=['okr','bct','fin','ins','ch','sa','sc','yoy','dta','hist','rtype','smix','supp','monitor','glass','cal','insComp'];
  var names=['OKR/KPI','ปิดได้/ส่งมอบ','การเงิน','ประกันภัย','ช่องทาง','SA','เชียร์เคลม','YoY','DTA','ข้อมูลย้อนหลัง','ประเภทซ่อม','Service Mix','ผลิตภัณฑ์เสริม','Monitor','เคลือบแก้ว','ปฏิทินสรุป','เปรียบเทียบประกัน'];
  totalToLoad=fns.length;
  loaded=0;
  for(var i=0;i<fns.length;i++){
    (function(idx){
      var fn=fns[idx], key=keys[idx], nm=names[idx]||key;
      google.script.run
        .withSuccessHandler(function(r){
          D[key]=r; loaded++;
          updateLoadProgress(keys,names);
          if(loaded===totalToLoad) allLoaded();
        })
        .withFailureHandler(function(e){
          showErr(key+': '+e.message); D[key]=null; loaded++;
          updateLoadProgress(keys,names);
          if(loaded===totalToLoad) allLoaded();
        })[fn]();
    })(i);
  }
}

/* ═══════════ Update load progress bar ═══════════ */
function updateLoadProgress(keys,loadNames){
  var pct=Math.round(loaded/totalToLoad*100);
  var fill=document.getElementById('loadBarFill');
  var pctEl=document.getElementById('loadPct');
  var det=document.getElementById('loadDetail');
  if(fill)fill.style.width=pct+'%';
  if(pctEl)pctEl.textContent=pct+'%';
  if(det){
    var items='';
    for(var j=0;j<keys.length;j++){
      var status=D[keys[j]]!==undefined?'✅':(loaded>0&&D[keys[j]]===null?'❌':'⏳');
      items+='<span style="margin-right:12px">'+status+' '+loadNames[j]+'</span>';
    }
    det.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:2px 0">'+items+'</div>';
  }
}

function allLoaded(){
  console.log('All data loaded, rendering...');
  try{renderDash();}catch(e){showErr('Dashboard: '+e.message);}
  try{renderOKR();}catch(e){showErr('OKR: '+e.message);}
  try{renderBCT();}catch(e){showErr('BCT: '+e.message);}
  try{renderFin();}catch(e){showErr('Finance: '+e.message);}
  try{renderIns();}catch(e){showErr('Insurance: '+e.message);}
  try{renderCh();}catch(e){showErr('Channels: '+e.message);}
  try{renderSA();}catch(e){showErr('SA: '+e.message);}
  try{renderSC();}catch(e){showErr('ShareClaim: '+e.message);}
  try{renderYoY();}catch(e){showErr('YoY: '+e.message);}
  try{renderDTA();}catch(e){showErr('DTA: '+e.message);}
  try{renderSupplement();}catch(e){showErr('ผลิตภัณฑ์เสริม: '+e.message);}
  try{renderMonitor();}catch(e){showErr('Monitor: '+e.message);}

/* ─── Dashboard: Month Comparison with Year ─── */
function renderDashComp(){
  var bctList=D.bct&&D.bct.bct?D.bct.bct:[];
  var finList=D.fin&&D.fin.fin?D.fin.fin:[];
  var yoy=D.yoy;
  var hist=D.hist||{};
  var MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  var selMA=document.getElementById('selMA');
  var selMB=document.getElementById('selMB');
  var selMC=document.getElementById('selMC');
  var selYearA=document.getElementById('selYearA');
  var selYearB=document.getElementById('selYearB');
  var selYearC=document.getElementById('selYearC');
  if(!selMA||!selMB)return;

  var iA=parseInt(selMA.value);
  var iB=parseInt(selMB.value);
  var iC=parseInt(selMC.value);
  var yA=parseInt(selYearA.value);
  var yB=parseInt(selYearB.value);
  var yC=parseInt(selYearC.value);

  // Helper: get month name from bctList
  function getMonthName(idx){return (idx>=0&&idx<bctList.length)?bctList[idx].m:MN[idx]||'?';}

  // Helper: get historical BCT for a year + month
  function getHistBct(monthIdx,thaiYear){
    var christianYear=getYearFromThai(thaiYear);
    var histYear=hist[christianYear];
    if(!histYear||!histYear.bct)return null;
    var mName=getMonthName(monthIdx);
    for(var i=0;i<histYear.bct.length;i++){
      var b=histYear.bct[i];
      if(b.m===mName||b.m.replace('.','')===mName.replace('.','')) return b;
    }
    // Fallback: try month index
    if(monthIdx>=0&&monthIdx<histYear.bct.length) return histYear.bct[monthIdx];
    return null;
  }

  // Helper: get historical Fin for a year + month
  function getHistFin(monthIdx,thaiYear){
    var christianYear=getYearFromThai(thaiYear);
    var histYear=hist[christianYear];
    if(!histYear||!histYear.fin)return null;
    var mName=getMonthName(monthIdx);
    for(var i=0;i<histYear.fin.length;i++){
      var f=histYear.fin[i];
      if(f.m===mName||f.m.replace('.','')===mName.replace('.','')) return f;
    }
    // Fallback: try month index
    if(monthIdx>=0&&monthIdx<histYear.fin.length) return histYear.fin[monthIdx];
    return null;
  }

  // Helper: get YoY delivery for a month+year (fallback when hist data unavailable)
  function getYoYDelivery(monthIdx,thaiYear){
    if(!yoy||!yoy.months)return null;
    var mName=getMonthName(monthIdx);
    var christianYear=getYearFromThai(thaiYear);
    for(var mi=0;mi<yoy.months.length;mi++){
      if(yoy.months[mi].month===mName||yoy.months[mi].month.replace('.','')===mName.replace('.','')){
        return yoy.months[mi].years[christianYear]||0;
      }
    }
    if(monthIdx>=0&&monthIdx<yoy.months.length){
      return yoy.months[monthIdx].years[christianYear]||0;
    }
    return null;
  }

  // Build comparison items — current year uses BCT/Fin, previous years use historical data
  var items=[];
  function addItem(monthIdx,year){
    if(monthIdx<0||year<=0)return;
    var mName=getMonthName(monthIdx);
    var isCurrentYear=(year===currentYear);
    var bctData,finData;
    if(isCurrentYear){
      bctData=bctList[monthIdx]||null;
      finData=(monthIdx<finList.length)?finList[monthIdx]:null;
    }else{
      bctData=getHistBct(monthIdx,year);
      finData=getHistFin(monthIdx,year);
    }
    // If no hist BCT, fallback to YoY delivery
    var yoyDelivery=null;
    if(!isCurrentYear&&!bctData){
      yoyDelivery=getYoYDelivery(monthIdx,year);
    }
    items.push({
      monthIdx:monthIdx, year:year, m:mName,
      bct:bctData, fin:finData,
      yoyDelivery:yoyDelivery,
      isCurrentYear:isCurrentYear
    });
  }
  addItem(iA,yA);
  addItem(iB,yB);
  if(iC>=0&&yC>0&&!(iC===iA&&yC===yA)&&!(iC===iB&&yC===yB)) addItem(iC,yC);

  var el=document.getElementById('dashComp');
  if(!el)return;

  if(items.length<2){
    el.innerHTML='<p style="color:var(--dim)">เลือกอย่าน้อย 2 เดือน/ปี เพื่อเปรียบเทียบ</p>';
    return;
  }

  // Build column headers with year
  var h='<div style="overflow-x:auto"><table><tr><th>ตัวชี้วัด</th>';
  items.forEach(function(it){
    var label=it.m+' <span class="badge badge-'+(it.year===69?'green':it.year===68?'blue':'orange')+'">ปี '+it.year+'</span>';
    h+='<th>'+label+'</th>';
  });
  if(items.length===2){
    h+='<th>ผลต่าง</th><th>%เปลี่ยน</th>';
  }
  h+='</tr>';

  // BCT rows — now with full historical data support
  var metrics=[
    {label:'ปิดได้ (คัน)',getV:function(it){
      if(it.bct) return it.bct.ac;
      return null;
    }},
    {label:'ส่งมอบ (คัน)',getV:function(it){
      if(it.bct) return it.bct.ad;
      if(it.yoyDelivery!==null) return it.yoyDelivery;
      return null;
    }},
    {label:'🚛 รถใหญ่',getV:function(it){
      if(it.bct) return it.bct.big;
      return null;
    }},
    {label:'เงินสด (ทำได้)',getV:function(it){
      if(it.bct) return it.bct.cashA;
      return null;
    }}
  ];
  metrics.forEach(function(mt){
    h+='<tr><td><b>'+mt.label+'</b></td>';
    var vals=[];
    items.forEach(function(it){
      var v=mt.getV(it);
      vals.push(v);
      if(v===null){h+='<td style="color:#aaa">—</td>';}
      else{h+='<td>'+fmt(v)+'</td>';}
    });
    if(items.length===2&&vals[0]!==null&&vals[1]!==null){
      var d=(vals[0]||0)-(vals[1]||0);
      h+='<td class="'+(d>=0?'up':'dn')+'">'+(d>=0?'+':'')+fmt(d)+'</td>';
      h+='<td>'+((vals[1])?((d/(vals[1]))*100).toFixed(1)+'%':'-')+'</td>';
    }else if(items.length===2){
      h+='<td style="color:#aaa">—</td><td style="color:#aaa">—</td>';
    }
    h+='</tr>';
  });

  // Finance rows — now available for all years with historical data
  var finMetrics=[
    {label:'รายได้',getV:function(it){return it.fin?it.fin.rA:null;},fmtV:function(v){return fmtB(v);}},
    {label:'ค่าแรง',getV:function(it){return it.fin?it.fin.sal:null;},fmtV:function(v){return fmtB(v);}},
    {label:'ค่าอะไหล่',getV:function(it){return it.fin?it.fin.pts:null;},fmtV:function(v){return fmtB(v);}},
    {label:'กำไรขั้นต้น',getV:function(it){return it.fin?it.fin.gm:null;},fmtV:function(v){return fmtB(v);}},
    {label:'ค่าแรง/คัน',getV:function(it){return it.fin&&it.fin.rpC?it.fin.rpC:null;},fmtV:function(v){return fmt(v);}},
    {label:'ค่าอะไหล่/คัน',getV:function(it){return it.fin&&it.fin.spC?it.fin.spC:null;},fmtV:function(v){return fmt(v);}}
  ];
  finMetrics.forEach(function(mt){
    h+='<tr><td><b>'+mt.label+'</b></td>';
    var vals=[];
    items.forEach(function(it){
      var v=mt.getV(it);
      vals.push(v);
      if(v===null){h+='<td style="color:#aaa">—</td>';}
      else{h+='<td>'+(mt.fmtV?mt.fmtV(v):fmt(v))+'</td>';}
    });
    if(items.length===2&&vals[0]!==null&&vals[1]!==null){
      var d=(vals[0]||0)-(vals[1]||0);
      h+='<td class="'+(d>=0?'up':'dn')+'">'+(d>=0?'+':'')+(mt.fmtV?mt.fmtV(d):fmt(d))+'</td>';
      h+='<td>'+((vals[1])?((d/(vals[1]))*100).toFixed(1)+'%':'-')+'</td>';
    }else if(items.length===2){
      h+='<td style="color:#aaa">—</td><td style="color:#aaa">—</td>';
    }
    h+='</tr>';
  });

  // YoY note row (when years differ)
  if(yA!==yB||(items.length===3&&yC!==yA)){
    var hasIncomplete=items.some(function(it){return !it.bct||!it.fin;});
    var note=hasIncomplete?
      '📝 หมายเหตุ: ข้อมูลบางเมตริกยังไม่พร้อมในปีนั้น — แสดงเฉพาะที่มีในระบบ':
      '📝 หมายเหตุ: ข้อมูลปี 67-68 มาจากชีทย้อนหลัง · ปี 69 จากข้อมูลปัจจุบัน';
    h+='<tr class="sub"><td colspan="'+(items.length+(items.length===2?3:1))+'"><b>'+note+'</b></td></tr>';
  }

  h+='</table></div>';
  el.innerHTML=h;
}

            return tgt?((v/1e6).toFixed(1)+'ลบ. ('+Math.round(v/tgt*100)+'%)'):(v/1e6).toFixed(1)+'ลบ.';

        },{fontSize:14}),
        scales:{y:{ticks:{color:'#64748b',callback:function(v){return(v/1e6).toFixed(0)+'ลบ.';}},grid:{color:'#e2e8f0'}},x:{ticks:{color:'#64748b'},grid:{display:false}}}
      },plugins:[ChartDataLabels]});
  }

  // ─── Chart: ค่าแรง vs ค่าอะไหล่/คัน ───
  if(finList.length&&document.getElementById('cOKR3')){

      barDS('ค่าแรง/คัน',finList.map(function(r){return r.rpC;}),'rgba(59,130,246,.6)','#3b82f6'),
      barDS('ค่าอะไหล่/คัน',finList.map(function(r){return r.spC;}),'rgba(139,92,246,.6)','#8b5cf6')
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:dlCfg(true,function(v){return fmt(v);},{fontSize:14}),scales:{y:{ticks:{color:'#64748b'},grid:{color:'#e2e8f0'}},x:{ticks:{color:'#64748b'},grid:{display:false}}}},plugins:[ChartDataLabels]});

  if(rt&&rt.monthly&&rt.monthly.length&&document.getElementById('cRepairType')){
    mkC('cRepairType',{type:'bar',data:{
      labels:rt.monthly.map(function(r){return r.m;}),
      datasets:[
        barDS('เบา',rt.monthly.map(function(r){return r.lq;}),'rgba(59,130,246,.7)','#3b82f6'),

  // ─── Chart: Service Mix percentages ───
  if(sm&&sm.categories&&sm.categories.length&&document.getElementById('cServiceMix')){

      labels:pctCats.map(function(c){return c.label;}),

/* ═══════════ Monitor Section (ใน OKR/KPI tab) ═══════════ */
function renderMonitor(){
  var mn=D.monitor;if(!mn||mn.err)return;
  var months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var h='';

  // ─── Helper KPI card builder ───
  function kpiCard(label,actual,target,unit){
    var pct=target?(actual/target*100):0;
    var pctClass=pct>=100?'pct-green':pct>=80?'pct-yellow':'pct-red';
    return '<div class="kpi"><div class="lbl">'+label+'</div><div class="val">'+fmt(actual)+'/'+fmt(target)+' '+(unit||'')+'</div><span class="'+pctClass+'">'+pct.toFixed(1)+'%</span></div>';
  }
  function kpi3(label,thai67,target68,cum68,unit){
    var pct=target68?(cum68/target68*100):0;
    var pctClass=pct>=100?'pct-green':pct>=80?'pct-yellow':'pct-red';
    return '<div class="kpi"><div class="lbl">'+label+'</div><div class="val" style="font-size:13px">67: <b>'+fmt(thai67)+'</b> | เป้า68: <b>'+fmt(target68)+'</b> | สสม: <b>'+fmt(cum68)+'</b>'+(unit?' '+unit:'')+'</div><span class="'+pctClass+'">'+pct.toFixed(1)+'%</span></div>';
  }
  function kpiSingle(label,val,unit){
    return '<div class="kpi"><div class="lbl">'+label+'</div><div class="val">'+fmt(val)+' '+(unit||'')+'</div></div>';
  }

  // ═══════ SECTION: ยอดส่งมอบ (คัน) ═══════
  var dv=mn.delivery;
  if(dv){
    h+='<div class="card"><h2>🚛 Monitor — ยอดส่งมอบ (คัน) ปี 68</h2>';
    h+='<div class="kpi-row">';
    h+=kpi3('ยอดรถรวม',dv.total.thai67,dv.total.target68,dv.total.cum68,'คัน');
    h+=kpi3('อีซูซู',dv.isuzu.thai67,dv.isuzu.target68,dv.isuzu.cum68,'คัน');
    h+=kpi3('ลูกค้าเงินสด',dv.cash.thai67,dv.cash.target68,dv.cash.cum68,'คัน');
    h+='</div><div class="kpi-row">';
    h+=kpi3('ต่างยี่ห้อ',dv.otherBrand.thai67,dv.otherBrand.target68,dv.otherBrand.cum68,'คัน');
    h+=kpi3('รถใหญ่',dv.bigTruck.thai67,dv.bigTruck.target68,dv.bigTruck.cum68,'คัน');
    h+=kpiSingle('ค่าแรง/คัน เป้า',dv.laborPerCar.target68,'บาท');
    h+=kpiSingle('ค่าอะไหล่/คัน เป้า',dv.partsPerCar.target68,'บาท');
    h+='</div>';
    // Chart: ยอดรถรวม vs เป้า vs ปี67
    if(dv.total.monthly&&dv.total.monthly.length){
      h+='<div class="chart-box lg"><canvas id="cMonDelivery"></canvas></div>';
    }
    h+='</div>';
  }

  // ═══════ SECTION: รายได้งานซ่อม ═══════
  var rv=mn.revenue;
  if(rv){
    h+='<div class="card"><h2>💰 Monitor — รายได้งานซ่อม ปี 68</h2>';
    h+='<div class="kpi-row">';
    h+=kpi3('GM ค่าแรง',rv.laborGM.thai67,rv.laborGM.target68,rv.laborGM.cum68,'บาท');
    h+=kpi3('ยอดอะไหล่',rv.partsTotal.thai67,rv.partsTotal.target68,rv.partsTotal.cum68,'บาท');
    h+=kpi3('GM อะไหล่',rv.partsGM.thai67,rv.partsGM.target68,rv.partsGM.cum68,'บาท');
    h+='</div>';
    if(rv.laborGM.monthly&&rv.laborGM.monthly.length){
      h+='<div class="chart-box lg"><canvas id="cMonRevenue"></canvas></div>';
    }
    h+='</div>';
  }

  // ═══════ SECTION: เคลือบแก้ว ═══════
  var gc=mn.glassCoat;
  if(gc){
    h+='<div class="card"><h2>🪟 Monitor — เคลือบแก้ว ปี 68</h2>';
    h+='<div class="kpi-row">';
    h+=kpi3('ยอดรถ (คัน)',gc.cars.thai67,gc.cars.target68,gc.cars.cum68||0,'คัน');
    h+=kpi3('GM รวม (บาท)',gc.gmTotal.thai67,gc.gmTotal.target68,gc.gmTotal.cum68||0,'บาท');
    h+=kpiSingle('GM/คัน เป้า',gc.gmPerCar.target68,'บาท');
    h+='</div>';
    if(gc.cars.monthly&&gc.cars.monthly.length){
      h+='<div class="chart-box lg"><canvas id="cMonGlassCoat"></canvas></div>';
    }
    h+='</div>';
  }

  // ═══════ SECTION: ผลิตภัณฑ์เสริม ═══════
  var sp=mn.supplement;
  if(sp){
    h+='<div class="card"><h2>🎁 Monitor — ผลิตภัณฑ์เสริม ปี 68</h2>';
    h+='<div class="kpi-row">';
    h+=kpi3('GM รวม',sp.gmTotal.thai67,sp.gmTotal.target68,sp.gmTotal.cum68||0,'บาท');
    h+=kpiSingle('GM/คัน เป้า',sp.gmPerCar.target68,'บาท');
    h+='</div>';
    if(sp.gmTotal.monthly&&sp.gmTotal.monthly.length){
      h+='<div class="chart-box lg"><canvas id="cMonSupplement"></canvas></div>';
    }
    h+='</div>';
  }

  // ═══════ SECTION: เชนโมเดล (เชียร์เคลมเพิ่ม) ═══════
  var cm=mn.chainModel;
  if(cm){
    h+='<div class="card"><h2>🔗 Monitor — เชนโมเดล (เชียร์เคลมเพิ่ม) ปี 68</h2>';
    h+='<div class="kpi-row">';
    h+=kpi3('GM ค่าแรง',cm.laborGM.thai67,cm.laborGM.target68,cm.laborGM.cum68||0,'บาท');
    h+=kpiSingle('GM/คัน เป้า',cm.gmPerCar.target68,'บาท');
    h+='</div>';
    if(cm.laborGM.monthly&&cm.laborGM.monthly.length){
      h+='<div class="chart-box lg"><canvas id="cMonChainModel"></canvas></div>';
    }
    h+='</div>';
  }

  // ═══════ SECTION: แสวงหา/สัมพันธ์/ใกล้ชิด/รับใช้ ═══════
  var cr=mn.crse;
  if(cr){
    h+='<div class="card"><h2>🤝 Monitor — แสวงหา/สัมพันธ์/ใกล้ชิด/รับใช้ ปี 68</h2>';
    h+='<div class="kpi-row">';
    if(cr.closeOnline)h+=kpi3('ปิด online',cr.closeOnline.thai67,cr.closeOnline.target68,cr.closeOnline.cum68||0,'คัน');
    if(cr.closeAI)h+=kpi3('ปิด AI',cr.closeAI.thai67,cr.closeAI.target68,cr.closeAI.cum68||0,'คัน');
    if(cr.closePaintQC)h+=kpi3('ปิด ตรวจเช็คคุณภาพสี',cr.closePaintQC.thai67,cr.closePaintQC.target68,cr.closePaintQC.cum68||0,'คัน');
    h+='</div><div class="kpi-row">';
    if(cr.closeMRSA)h+=kpi3('ปิด MR SA',cr.closeMRSA.thai67,cr.closeMRSA.target68,cr.closeMRSA.cum68||0,'คัน');
    if(cr.proactiveDelivery)h+=kpi3('ส่งมอบ เชิงรุก',cr.proactiveDelivery.thai67,cr.proactiveDelivery.target68,cr.proactiveDelivery.cum68||0,'คัน');
    h+='</div>';
    // MAPP score display
    if(cr.loadMAPP&&cr.loadMAPP.monthly){
      var mappVals=cr.loadMAPP.monthly.filter(function(v){return v!==null&&v!==undefined;});
      if(mappVals.length){
        h+='<div class="kpi-row">';
        mappVals.forEach(function(v,i){
          h+='<div class="kpi"><div class="lbl">โหลด MAPP '+months[i]+'</div><div class="val" style="font-size:16px">'+v+'</div></div>';
        });
        h+='</div>';
      }
    }
    // Chart: CRSE stacked bar
    if(cr.closeOnline&&cr.closeOnline.monthly){
      h+='<div class="chart-box lg"><canvas id="cMonCRSE"></canvas></div>';
    }
    h+='</div>';
  }

  // ═══════ SECTION: AI ตรวจรถรอบคัน ═══════
  var ai=mn.aiInspect;
  if(ai){
    h+='<div class="card"><h2>🤖 Monitor — AI ตรวจรถรอบคัน ปี 68</h2>';
    h+='<div class="kpi-row">';
    h+=kpi3('เปิดเคลม',ai.openClaim.thai67||0,ai.openClaim.target68,ai.openClaim.cum68||0,'คัน');
    h+=kpi3('ส่งมอบ',ai.delivered.thai67||0,ai.delivered.target68,ai.delivered.cum68||0,'คัน');
    h+=kpiSingle('เข้าซ่อม ทำได้ปี67',ai.enterRepair.thai67||0,'คัน');
    h+='</div>';
    if(ai.openClaim.monthly&&ai.openClaim.monthly.length){
      h+='<div class="chart-box lg"><canvas id="cMonAIInspect"></canvas></div>';
    }
    h+='</div>';
  }

  // ═══════ Now add target lines to all Monitor charts ═══════

/* ─── OKR Detail (selected month) ─── */
function renderOKRDetail(){
  var d=D.okr;var f=D.fin;if(!d)return;
  var months=d.months||[];
  var sel=document.getElementById('selOKRMonth');
  if(!sel)return;
  var idx=parseInt(sel.value);
  var el=document.getElementById('okrDetail');
  var cardsEl=document.getElementById('okrKpiCards');
  if(!el)return;
  if(idx<0||idx>=months.length){el.innerHTML='';if(cardsEl)cardsEl.innerHTML='';return;}
  var m=months[idx];
  var fm=idx<(f&&f.fin?f.fin.length:0)?f.fin[idx]:null;
  var bm=idx<(D.bct&&D.bct.bct?D.bct.bct.length:0)?D.bct.bct[idx]:null;
  var rm=idx<(D.rtype&&D.rtype.monthly?D.rtype.monthly.length:0)?D.rtype.monthly[idx]:null;

  // Calculate month-specific KPIs
  var carTgt=m.target||0;
  var carAct=m.actual||0;
  var carPct=carTgt?(carAct/carTgt*100):0;
  var carRem=carAct-carTgt;
  var revTgt=fm?fm.rT:0;
  var revAct=fm?fm.rA:0;
  var revPct=revTgt?(revAct/revTgt*100):0;
  var revRem=revAct-revTgt;
  var avgRev=carAct?Math.round(revAct/carAct):0;
  var avgLab=carAct&&fm&&fm.rpC?fm.rpC:0;
  var avgParts=carAct&&fm&&fm.spC?fm.spC:0;

  // BCT detail
  var delTgt=bm?bm.td:0;
  var delAct=bm?bm.ad:0;
  var bigTruck=bm?bm.big:0;
  var cashTgt=bm?bm.cashT:0;
  var cashAct=bm?bm.cashA:0;
  var delPct=delTgt?(delAct/delTgt*100):0;
  var cashPct=cashTgt?(cashAct/cashTgt*100):0;

  // KPI cards
  var kh='<div class="kpi-row">';
  kh+='<div class="kpi"><div class="lbl">📌 '+m.m+' — เป้า/ทำได้ (รถ)</div><div class="val">'+fmt(carTgt)+'/'+fmt(carAct)+'</div>'+pctS(carPct,'ทำได้ '+carPct.toFixed(1)+'%')+'</div>';
  kh+='<div class="kpi"><div class="lbl">ส่งมอบ เป้า/ทำได้</div><div class="val">'+fmt(delTgt)+'/'+fmt(delAct)+'</div>'+pctS(delPct,'ทำได้ '+delPct.toFixed(1)+'%')+'</div>';
  kh+='<div class="kpi"><div class="lbl">เป้ารายได้ / รายได้จริง</div><div class="val">'+fmtB(revTgt)+'/'+fmtB(revAct)+'</div>'+pctS(revPct,'ทำได้ '+revPct.toFixed(1)+'%')+'</div>';
  kh+='</div><div class="kpi-row">';
  kh+='<div class="kpi"><div class="lbl">รายได้/คัน</div><div class="val">'+fmtB(avgRev)+'</div></div>';
  kh+='<div class="kpi"><div class="lbl">ค่าแรง/คัน</div><div class="val">'+fmtB(avgLab)+'</div></div>';
  kh+='<div class="kpi"><div class="lbl">ค่าอะไหล่/คัน</div><div class="val">'+fmtB(avgParts)+'</div></div>';
  kh+='<div class="kpi"><div class="lbl">🚛 รถใหญ่</div><div class="val">'+fmt(bigTruck)+' คัน</div></div>';
  kh+='<div class="kpi"><div class="lbl">💵 เงินสด เป้า/ทำได้</div><div class="val">'+fmt(cashTgt)+'/'+fmt(cashAct)+'</div>'+pctS(cashPct,'ทำได้ '+cashPct.toFixed(1)+'%')+'</div>';
  kh+='</div>';

  // Repair type for selected month
  if(rm){
    kh+='<div class="kpi-row">';
    kh+='<div class="kpi"><div class="lbl">🔧 ซ่อมเบา</div><div class="val">'+fmt(rm.lq)+' คัน</div></div>';
    kh+='<div class="kpi"><div class="lbl">🔧 ซ่อมกลาง</div><div class="val">'+fmt(rm.mq)+' คัน</div></div>';
    kh+='<div class="kpi"><div class="lbl">🔧 ซ่อมหนัก</div><div class="val">'+fmt(rm.hq)+' คัน</div></div>';
    kh+='<div class="kpi"><div class="lbl">รวมซ่อม</div><div class="val">'+fmt(rm.tq)+' คัน</div></div>';
    kh+='</div>';
  }

  if(cardsEl)cardsEl.innerHTML=kh;

  // Previous year comparison
  var hist=D.hist||{};
  var hist68=hist['2025']||{};
  var histBct68=hist68.bct?hist68.bct[idx]:null;
  var histFin68=hist68.fin?hist68.fin[idx]:null;
  var detH='<div class="kpi-row" style="margin-top:6px">';
  if(histBct68){
    detH+='<div class="kpi" style="border-color:rgba(251,191,36,.3)"><div class="lbl">📊 ปี68 '+m.m+' ส่งมอบ</div><div class="val" style="color:#fbbf24">'+fmt(histBct68.ad)+'</div></div>';
  }
  if(histFin68){
    detH+='<div class="kpi" style="border-color:rgba(251,191,36,.3)"><div class="lbl">📊 ปี68 '+m.m+' รายได้</div><div class="val" style="color:#fbbf24">'+fmtB(histFin68.rA)+'</div></div>';
  }
  detH+='</div>';
  el.innerHTML=detH;
}

/* ─── SA: รับรถ VS ส่งมอบ เปรียบเทียบรายคน ─── */
function renderSACompare(){
  var d=D.sa;if(!d||!d.detail)return;
  var dt=d.detail;
  var monthly=dt.monthly||[];
  var cats=dt.categories||[];
  var persons=dt.persons||[];
  var catReceive=cats[0]||'';
  var catDeliver=cats[1]||'';

  var selIdx=parseInt(document.getElementById('selSAMonthTop').value)||0;
  if(selIdx<0||selIdx>=monthly.length) selIdx=0;
  var m=monthly[selIdx];
  var mData=m.data||{};
  var label=m.label||('M'+(selIdx+1));

  // KPI row
  var totalR=0,totalD=0;
  persons.forEach(function(p){totalR+=(mData[catReceive]&&mData[catReceive][p])||0;totalD+=(mData[catDeliver]&&mData[catDeliver][p])||0;});
  var kpiEl=document.getElementById('saCompKpi');
  if(kpiEl){
    var pct=totalR>0?Math.round(totalD/totalR*1000)/10:0;
    kpiEl.innerHTML='<div class="kpi-row"><div class="kpi"><div class="lbl">📌 ข้อมูลเดือน</div><div class="val" style="color:var(--accent)">'+label+'</div></div><div class="kpi"><div class="lbl">🚗 รับรถ</div><div class="val">'+fmt(totalR)+'</div><div class="lbl">คัน</div></div><div class="kpi"><div class="lbl">🚛 ส่งมอบ</div><div class="val">'+fmt(totalD)+'</div><div class="lbl">คัน</div></div><div class="kpi"><div class="lbl">📊 ส่งมอบ/รับรถ</div><div class="val">'+pct.toFixed(1)+'%</div>'+pctS(pct,pct.toFixed(1)+'%')+'</div></div>';
  }

  // Grouped bar chart: รับรถ vs ส่งมอบ per person
  var receiveData=persons.map(function(p){return (mData[catReceive]&&mData[catReceive][p])||0;});
  var deliverData=persons.map(function(p){return (mData[catDeliver]&&mData[catDeliver][p])||0;});
  var datasets=[
    barDS('รับรถ',receiveData,'#3b82f6'),
    barDS('ส่งมอบ',deliverData,'#10b981')
  ];
  mkC('cSAComp',{type:'bar',data:{labels:persons,datasets:datasets},options:{responsive:true,maintainAspectRatio:false,plugins:dlCfg(true,function(v){return v?v:'';},{anchor:'end',align:'top',fontSize:14,fontWeight:'bold'}),scales:{y:{title:{display:true,text:'คัน',color:'#64748b'},ticks:{color:'#64748b'},grid:{color:'#e2e8f0'}},x:{ticks:{color:'#64748b'},grid:{display:false}}}},plugins:[ChartDataLabels]});

  // Detail table
  var tblEl=document.getElementById('saCompTbl');
  if(!tblEl)return;
  var th='<table><tr><th>ชื่อ</th><th>🚗 รับรถ (คัน)</th><th>🚛 ส่งมอบ (คัน)</th><th>% ส่งมอบ</th><th>差</th></tr>';
  persons.forEach(function(p){
    var r=(mData[catReceive]&&mData[catReceive][p])||0;
    var dl=(mData[catDeliver]&&mData[catDeliver][p])||0;
    var pp=r>0?Math.round(dl/r*1000)/10:0;
    var diff=dl-r;
    th+='<tr><td><b>'+p+'</b></td><td>'+fmt(r)+'</td><td>'+fmt(dl)+'</td><td class="'+pctC(pp)+'">'+pp.toFixed(1)+'%</td><td style="color:'+(diff>=0?'#10b981':'#ef4444')+'">'+(diff>0?'+':'')+diff+'</td></tr>';
  });
  th+='<tr style="border-top:2px solid #334155"><td><b>รวม</b></td><td><b>'+fmt(totalR)+'</b></td><td><b>'+fmt(totalD)+'</b></td><td class="'+pctC(pct)+'"><b>'+pct.toFixed(1)+'%</b></td><td style="color:'+(totalD-totalR>=0?'#10b981':'#ef4444')+'"><b>'+(totalD-totalR>0?'+':'')+( totalD-totalR)+'</b></td></tr>';

}
function renderSADetail(){
  var d=D.sa;if(!d||!d.detail)return;
  var dt=d.detail;
  var monthly=dt.monthly||[];
  var cats=dt.categories||[];
  var catLabels=dt.catLabels||cats;
  var persons=dt.persons||[];
  var selIdx=parseInt(document.getElementById('selSAMonth').value);
  var el=document.getElementById('saMonthKpi');
  if(!el)return;

  if(selIdx<0||selIdx>=monthly.length){
    el.innerHTML='<p style="color:var(--dim)">เลือกเดือนเพื่อดูรายละเอียด</p>';
    return;
  }

  var m=monthly[selIdx];
  var mData=m.data||{};
  var label=m.label||('M'+(selIdx+1));

  // Sum totals per category (additive: คัน, บาท)
  var catSums={};
  cats.forEach(function(c){
    catSums[c]=0;
    persons.forEach(function(p){catSums[c]+=(mData[c]&&mData[c][p])||0;});
  });

  // Weighted average for per-car rates: ค่าแรง/คัน = รวมค่าแรง ÷ รวมคันส่งมอบ
  var c0=cats[0]||''; // รับรถ (คัน)
  var c1=cats[1]||''; // ส่งมอบ (คัน)
  var c3=cats[3]||''; // ค่าแรงรายคน
  var c4=cats[4]||''; // ค่าอะไหล่รายคน
  var c5=cats[5]||''; // ค่าแรง/คัน (per-person rates)
  var c6=cats[6]||''; // ค่าอะไหล่/คัน (per-person rates)
  var avgLPC=(catSums[c1]>0)?(catSums[c3]/catSums[c1]):0; // เฉลี่ยถ่วงน้ำหนัก ค่าแรง/คัน
  var avgPPC=(catSums[c1]>0)?(catSums[c4]/catSums[c1]):0; // เฉลี่ยถ่วงน้ำหนัก ค่าอะไหล่/คัน

  var h='<div class="kpi-row">';
  h+='<div class="kpi"><div class="lbl">📌 ข้อมูลเดือน</div><div class="val" style="color:var(--accent)">'+label+'</div></div>';
  if(catSums[c0]!==undefined) h+='<div class="kpi"><div class="lbl">🚗 รับรถ</div><div class="val">'+fmt(catSums[c0])+'</div><div class="lbl">คัน</div></div>';
  if(catSums[c1]!==undefined) h+='<div class="kpi"><div class="lbl">🚛 ส่งมอบ</div><div class="val">'+fmt(catSums[c1])+'</div><div class="lbl">คัน</div></div>';
  if(catSums[c3]!==undefined) h+='<div class="kpi"><div class="lbl">🔧 ค่าแรง</div><div class="val">'+fmtB(catSums[c3])+'</div><div class="lbl">บาท</div></div>';
  if(catSums[c4]!==undefined) h+='<div class="kpi"><div class="lbl">🔩 ค่าอะไหล่</div><div class="val">'+fmtB(catSums[c4])+'</div><div class="lbl">บาท</div></div>';
  h+='<div class="kpi"><div class="lbl">📈 ค่าแรง/คัน</div><div class="val">'+fmt(Math.round(avgLPC))+'</div><div class="lbl">บาท (เฉลี่ย)</div></div>';
  h+='<div class="kpi"><div class="lbl">📊 ค่าอะไหล่/คัน</div><div class="val">'+fmt(Math.round(avgPPC))+'</div><div class="lbl">บาท (เฉลี่ย)</div></div>';
  h+='</div>';
  el.innerHTML=h;
}

function renderSAChart(){
  var d=D.sa;if(!d||!d.detail)return;
  var dt=d.detail;
  var cats=dt.categories||[];
  var catLabels=dt.catLabels||cats;
  var persons=dt.persons||[];
  var monthly=dt.monthly||[];
  var monthLabels=monthly.map(function(m){return m.label||'M'+(m.month);});

  var catIdx=parseInt(document.getElementById('selSACat').value)||0;
  var selPerson=document.getElementById('selSAPerson').value;
  var catName=cats[catIdx]||cats[0];
  var catLabel=catLabels[catIdx]||catName;
  var colors=['#3b82f6','#10b981','#f59e0b','#f97316','#8b5cf6','#ec4899'];

  var datasets=[];
  var isMoney=catIdx>=2&&catIdx<=4;
  var isPerCar=catIdx>=5;

  if(selPerson==='all'){
    persons.forEach(function(pname,idx){
      var data=monthly.map(function(m){
        return (m.data[catName]&&m.data[catName][pname])||0;
      });
      datasets.push(barDS(pname,data,colors[idx%colors.length]));
    });
  } else {
    var data=monthly.map(function(m){
      return (m.data[catName]&&m.data[catName][selPerson])||0;
    });
    datasets.push(barDS(selPerson,data,colors[0]));
  }

  var yLabel=isMoney?'บาท':isPerCar?'บาท/คัน':'คัน';
  mkC('cSA',{type:'bar',data:{labels:monthLabels,datasets:datasets},options:{responsive:true,maintainAspectRatio:false,plugins:dlCfg(true,function(v){return v?fmt(v):'';},{fontSize:14}),scales:{y:{title:{display:true,text:yLabel,color:'#64748b'},ticks:{color:'#64748b'},grid:{color:'#e2e8f0'}},x:{ticks:{color:'#64748b'},grid:{display:false}}}},plugins:[ChartDataLabels]});

  // Update detail table
  var el=document.getElementById('saDetailTbl');
  if(!el)return;
  var th='<h2>📋 '+catLabel+' รายเดือน</h2><div style="overflow-x:auto"><table><tr><th>เดือน</th>';
  persons.forEach(function(p){th+='<th>'+p+'</th>';});
  th+='<th>รวม</th></tr>';
  monthly.forEach(function(m,i){
    th+='<tr><td>'+monthLabels[i]+'</td>';
    var total=0;
    persons.forEach(function(pname){
      var v=(m.data[catName]&&m.data[catName][pname])||0;
      total+=v;
      th+='<td>'+(v?(isMoney?fmtB(v):(isPerCar?fmt(Math.round(v)):fmt(v))):'-')+'</td>';
    });
    // For per-car categories, show weighted average instead of sum
    var totalDisplay;
    if(isPerCar){
      var deliveredCat=cats[1]||'';
      var laborCat=cats[3]||'';
      var partsCat=cats[4]||'';
      var totalCars=(m.data[deliveredCat])?persons.reduce(function(s,p){return s+((m.data[deliveredCat]&&m.data[deliveredCat][p])||0);},0):0;
      if(catIdx===5&&totalCars>0){ // ค่าแรง/คัน
        var totalLabor=persons.reduce(function(s,p){return s+((m.data[laborCat]&&m.data[laborCat][p])||0);},0);
        totalDisplay=fmt(Math.round(totalLabor/totalCars))+' (เฉลี่ย)';
      } else if(catIdx===6&&totalCars>0){ // ค่าอะไหล่/คัน
        var totalParts=persons.reduce(function(s,p){return s+((m.data[partsCat]&&m.data[partsCat][p])||0);},0);
        totalDisplay=fmt(Math.round(totalParts/totalCars))+' (เฉลี่ย)';
      } else { totalDisplay=fmt(Math.round(total)); }
    } else {
      totalDisplay=isMoney?fmtB(total):fmt(total);
    }
    th+='<td><b>'+totalDisplay+'</b></td></tr>';
  });
  th+='</table></div>';
  el.innerHTML=th;
}

      return{label:name,data:d.saMonthly[idx],borderWidth:2,fill:false,tension:.3,borderColor:colors[idx%colors.length],backgroundColor:colors[idx%colors.length]+'33'};

        h2+='<td>'+fmt(md.gmLabor)+'</td>';

        h2+='<td>'+fmt(md.gmParts)+'</td>';
        h2+='<td>'+fmt(md.avgParts)+'</td>';
      });

      saOrder.forEach(function(n){
        var tc=0,tl=0,gl=0,al=0,tp=0,gp=0,ap=0;

        gl=tc>0?Math.round(tl/(tc)):0;al=gl;gp=tc>0?Math.round(tp/(tc)):0;ap=gp;

        h2+='<td>'+fmt(gp)+'</td>';

      });

    h2+='</table></div>';

/* ═══════════ Summary (Daily Calendar Summary) ═══════════ */
var _summaryDate='today';

function renderSummary(){
  var cal=D.cal;
  if(!cal||!cal.sections){document.getElementById('p-summary').innerHTML='<div class="card"><h2>⚠️ ไม่มีข้อมูลปฏิทินสรุปรายวัน</h2><p>ลองรีเฟรชหน้า</p></div>';return;}

  var sections=cal.sections;
  var secMap={};
  sections.forEach(function(s){secMap[s.key]=s;});

  var todayD=new Date();
  var todayY=todayD.getFullYear();
  var todayM=String(todayD.getMonth()+1).padStart(2,'0');
  var todayDD=String(todayD.getDate()).padStart(2,'0');
  var todayStr=todayY+'-'+todayM+'-'+todayDD;
  var tmD=new Date(todayD.getTime()+86400000);
  var tmStr=tmD.getFullYear()+'-'+String(tmD.getMonth()+1).padStart(2,'0')+'-'+String(tmD.getDate()).padStart(2,'0');
  var curMonth=todayStr.slice(0,7);

  var thaiDays=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  var thaiDaysShort=['อา','จ','อ','พ','พฤ','ศ','ส'];
  var thaiMonths=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  function fmtDateFull(ds){
    var d=new Date(ds+'T00:00:00');
    return 'วัน'+thaiDays[d.getDay()]+' ('+parseInt(ds.slice(8))+'/'+parseInt(ds.slice(5,7))+'/'+(parseInt(ds.slice(0,4))+543)+')';
  }

  var selDate=_summaryDate==='tomorrow'?tmStr:todayStr;
  var TARGET=15;

  // Section defs for summary
  var sumDefs=[
    {key:'c11',icon:'📅',label:'นัดหมายเข้าซ่อม',shortLabel:'นัดซ่อม',dateKey:'tomorrow'},
    {key:'c12',icon:'🚗',label:'รับรถเข้าซ่อมจริง',shortLabel:'รับรถ',dateKey:'today'},
    {key:'c13',icon:'🔧',label:'นัดหมายช่าง',shortLabel:'นัดช่าง',dateKey:'tomorrow'},
    {key:'c15a',icon:'✅',label:'ส่งมอบรถจริง',shortLabel:'ส่งมอบ',dateKey:'today'}
  ];

  var h='';

  // Date toggle buttons
  h+='<div class="summary-date-toggle">';
  h+='<div class="summary-date-btn'+(_summaryDate==='today'?' active':'')+'" onclick="_summaryDate=\'today\';renderSummary();">🌅 วันนี้<br><small>'+thaiDaysShort[todayD.getDay()]+' '+parseInt(todayDD)+'/'+parseInt(todayM)+'</small></div>';
  h+='<div class="summary-date-btn'+(_summaryDate==='tomorrow'?' active':'')+'" onclick="_summaryDate=\'tomorrow\';renderSummary();">🌅 พรุ่งนี้<br><small>'+thaiDaysShort[tmD.getDay()]+' '+parseInt(String(tmStr.slice(8)))+'/'+parseInt(tmStr.slice(5,7))+'</small></div>';
  h+='</div>';

  // Render cards for each section
  sumDefs.forEach(function(def){
    var sec=secMap[def.key];
    var refDate=def.dateKey==='tomorrow'?tmStr:todayStr;
    // Count entries for this date
    var groups={};
    var total=0;
    var noTechCount=0;
    if(sec){
      sec.entries.forEach(function(entry){
        entry.cells.forEach(function(c){
          if(c.dt===refDate&&c.val){
            total++;
            var valParts=c.val.trim().split(/\s+/);
            var plateOnly=valParts[0];
            var techInfo=valParts.length>1?valParts[1]:'';
            var techName=techInfo.indexOf('_')>=0?techInfo.split('_').pop():techInfo;
            if(!techName||!techName.trim()){
              noTechCount++;
            }else{
              if(!groups[techName])groups[techName]=[];
              groups[techName].push(plateOnly);
            }
          }
        });
      });
    }
    if(noTechCount>0){
      groups['ไม่ระบุ']=[];
      if(sec){
        sec.entries.forEach(function(entry){
          entry.cells.forEach(function(c){
            if(c.dt===refDate&&c.val){
              var valParts=c.val.trim().split(/\s+/);
              var techInfo=valParts.length>1?valParts[1]:'';
              var techName=techInfo.indexOf('_')>=0?techInfo.split('_').pop():techInfo;
              if(!techName||!techName.trim()){
                groups['ไม่ระบุ'].push(valParts[0]);
              }
            }
          });
        });
      }
    }
    var diff=total-TARGET;
    var diffLabel=diff>0?'summary-above':(diff<0?'summary-below':'summary-on');
    var diffText=diff>0?'เกินเป้า +'+diff:(diff<0?'ต่ำกว่าเป้า '+diff:'✓ ตรงเป้า');

    h+='<div class="summary-card">';
    h+='<div class="summary-card-header">';
    h+='<h3>'+def.icon+' '+def.label+' <small style="color:#94a3b8;font-weight:400">'+fmtDateFull(refDate)+'</small></h3>';
    h+='<div><span class="count" style="color:'+(diff>=0?'#10b981':'#ef4444')+'">'+total+'</span> <span style="color:#94a3b8;font-size:.75rem">/'+TARGET+'</span> <span class="'+diffLabel+'">'+diffText+'</span></div>';
    h+='</div>';
    h+='<div class="summary-card-body">';
    if(total===0){
      h+='<div class="summary-empty">— ไม่มีข้อมูล —</div>';
    }else{
      var techNames=Object.keys(groups).sort(function(a,b){return groups[b].length-groups[a].length;});
      techNames.forEach(function(tech){
        var plates=groups[tech];
        h+='<div class="summary-row">';
        h+='<div class="tech">'+escHtml(tech)+'</div>';
        h+='<div class="plates">'+plates.map(function(p){return escHtml(p);}).join(', ')+'</div>';
        h+='<div class="num">'+plates.length+'</div>';
        h+='</div>';
      });
    }
    h+='</div></div>';
  });

  // Monthly totals
  var mLabel=thaiMonths[parseInt(curMonth.slice(5,7))]+' '+(parseInt(curMonth.slice(0,4))+543);
  h+='<div class="summary-month">';
  h+='<div class="summary-month-header"><h3>📈 ยอดสะสมประจำเดือน '+mLabel+'</h3></div>';

  sumDefs.forEach(function(def){
    var sec=secMap[def.key];
    if(!sec)return;
    var mTotal=0;
    var mTech={};
    var daysSet={};
    sec.entries.forEach(function(entry){
      entry.cells.forEach(function(c){
        if(c.dt&&c.dt.indexOf(curMonth)===0&&c.val){
          mTotal++;
          daysSet[c.dt]=true;
          var valParts=c.val.trim().split(/\s+/);
          var techInfo=valParts.length>1?valParts[1]:'';
          var techName=techInfo.indexOf('_')>=0?techInfo.split('_').pop():(techInfo||'ไม่ระบุ');
          if(!techName||!techName.trim())techName='ไม่ระบุ';
          mTech[techName]=(mTech[techName]||0)+1;
        }
      });
    });
    var numDays=Object.keys(daysSet).length;
    var sorted=Object.keys(mTech).sort(function(a,b){return mTech[b]-mTech[a];});
    var techParts=sorted.map(function(t){return t+':'+mTech[t];});
    var avg=numDays>0?(mTotal/numDays).toFixed(1):'0';

    h+='<div class="summary-row">';
    h+='<div class="tech">'+def.icon+'</div>';
    h+='<div class="plates" style="font-weight:600">'+def.shortLabel+' <b>'+mTotal+'</b> คัน ('+numDays+' วัน, เฉลี่ย '+avg+'/วัน) <small style="color:#94a3b8">['+techParts.join(', ')+']</small></div>';
    h+='</div>';
  });

  h+='</div>';

  // Refresh buttons
  h+='<div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">';
  h+='<button style="padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;border:1.5px solid #3b82f6;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.3)" onclick="refreshAllData()">🔄 รีเฟรชข้อมูลทั้งหมด</button>';
  h+='<button style="padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;border:1.5px solid #7c3aed;background:#fff;color:#7c3aed;box-shadow:0 1px 3px rgba(0,0,0,.05)" onclick="refreshSummaryOnly()">📅 รีเฟรชปฏิทินเท่านั้น</button>';
  h+='</div>';

  document.getElementById('p-summary').innerHTML=h;
}

        plugins:{legend:{position:'top',labels:{font:{size:11}}},

document.getElementById('tabs').addEventListener('click',function(e){

  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  tab.classList.add('active');
  var panel=document.getElementById('p-'+tab.getAttribute('data-p'));
  if(panel)panel.classList.add('active');
  // Render summary when tab is activated
  if(tab.getAttribute('data-p')==='summary'&&D&&D.cal){
    renderSummary();
  }
  // Render brief when tab is activated
  if(tab.getAttribute('data-p')==='brief'&&D&&D.bct){
    renderBrief();
  }
  // Render insurance comparison when tab is activated
  if(tab.getAttribute('data-p')==='insComp'&&D&&D.insComp){
    renderInsCompare();
  }
});

  h+='<div id="suppPersonTbl" style="overflow-x:auto;margin-top:10px"></div>';
  h+='</div>';

  /* ── Section 2: GM รายผลิตภัณฑ์ ── */
  h+='<div class="card"><h2>🏭 รายได้ GM ตามประเภทผลิตภัณฑ์เสริม</h2>';

  // View selector (GM vs Car count)
  h+='<div class="sel-group">';
  h+='<label>📊 มุมมอง: <select id="selSuppView" onchange="renderSuppProduct()">';
  h+='<option value="gm">รายได้ GM (บาท)</option>';
  h+='<option value="car">จำนวนคัน</option>';
  h+='</select></label>';
  h+='<label>📅 เดือน: <select id="selSuppProdMonth" onchange="renderSuppProduct()">';
  h+='<option value="-1">รวมทุกเดือน</option>';
  prodGMMonthly.forEach(function(m,i){h+='<option value="'+i+'">'+m.month+'</option>';});
  h+='</select></label></div>';

  h+='<div id="suppProductKpi"></div>';
  h+='<div class="chart-box lg"><canvas id="cSuppProduct"></canvas></div>';
  h+='<div id="suppProductTbl" style="overflow-x:auto;margin-top:10px"></div>';

  document.getElementById('p-supp').innerHTML=h;

function renderSuppProduct(){
  var d=D.supp;if(!d)return;
  var prodNames=d.productNames||[];
  var prodGMMonthly=d.prodGMMonthly||[];
  var carMonthly=d.carMonthly||[];
  var prodTotalsGM=d.prodTotalsGM||{};
  var carTotals=d.carTotals||{};
  var view=document.getElementById('selSuppView').value;
  var selIdx=parseInt(document.getElementById('selSuppProdMonth').value);

  var isGM=view==='gm';
  var monthlyData=isGM?prodGMMonthly:carMonthly;
  var totals=isGM?prodTotalsGM:carTotals;
  var unitLabel=isGM?'บาท':'คัน';
  var fmtFunc=isGM?fmtB:fmt;

  // Sort products by total value descending
  var sortedProds=prodNames.slice().sort(function(a,b){return(totals[b]||0)-(totals[a]||0);});
  var topProds=sortedProds.slice(0,10); // Top 10 for chart clarity

  // KPI row
  var kpiEl=document.getElementById('suppProductKpi');
  if(kpiEl){
    var totalVal=isGM?d.gmAchieved:d.totalCarsAll;
    var kpiH='<div class="kpi-row">';
    if(selIdx>=0&&selIdx<monthlyData.length){
      var mo=monthlyData[selIdx];
      kpiH+='<div class="kpi"><div class="lbl">📌 เดือน</div><div class="val" style="color:var(--accent)">'+mo.month+'</div></div>';
      kpiH+='<div class="kpi"><div class="lbl">📊 รวม '+(isGM?'GM':'คัน')+'</div><div class="val">'+fmtFunc(mo.total||0)+'</div></div>';
    } else {
      kpiH+='<div class="kpi"><div class="lbl">📊 รวม '+(isGM?'GM สะสม':'คัน สะสม')+'</div><div class="val">'+fmtFunc(totalVal)+'</div></div>';
    }
    kpiH+='</div>';
    kpiEl.innerHTML=kpiH;
  }

  // Chart
  if(selIdx>=0&&selIdx<monthlyData.length){
    // Single month bar chart
    var mo=monthlyData[selIdx];
    var byProd=mo.byProduct||{};
    var chartProds=topProds;
    var chartData=chartProds.map(function(p){return byProd[p]||0;});
    var chartColors=['#3b82f6','#10b981','#f59e0b','#f97316','#8b5cf6','#06b6d4','#ec4899','#14b8a6','#a855f7','#ef4444'];
    var datasets=[barDS(mo.month,chartData,chartColors.map(function(_,i){return chartColors[i%chartColors.length];}))];
    mkC('cSuppProduct',{type:'bar',data:{labels:chartProds,datasets:datasets},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:dlCfg(true,function(v){return v?fmtFunc(v):'';},{anchor:'end',align:'right',fontSize:14,fontWeight:'bold'}),scales:{x:{title:{display:true,text:unitLabel,color:'#64748b'},ticks:{color:'#64748b',callback:function(v){return isGM?fmtB(v):fmt(v);}},grid:{color:'#e2e8f0'}},y:{ticks:{color:'#64748b'},grid:{display:false}}}},plugins:[ChartDataLabels]});
  } else {
    // All months line/bar chart for top products
    var datasets=[];
    var chartProds=topProds.slice(0,6);
    var chartColors=['#3b82f6','#10b981','#f59e0b','#f97316','#8b5cf6','#ec4899'];
    chartProds.forEach(function(p,idx){
      var data=monthlyData.map(function(m){return (m.byProduct||{})[p]||0;});
      datasets.push(barDS(p,data,chartColors[idx%chartColors.length]));
    });
    mkC('cSuppProduct',{type:'bar',data:{labels:monthlyData.map(function(m){return m.month;}),datasets:datasets},options:{responsive:true,maintainAspectRatio:false,plugins:Object.assign(dlCfg(true,function(v){return v?fmtFunc(v):'';},{fontSize:14}),{legend:{labels:{color:'#64748b',font:{size:10}}}}),scales:{y:{title:{display:true,text:unitLabel,color:'#64748b'},ticks:{color:'#64748b',callback:function(v){return isGM?fmtB(v):fmt(v);}},grid:{color:'#e2e8f0'}},x:{ticks:{color:'#64748b'},grid:{display:false}}}},plugins:[ChartDataLabels]});
  }

  // Table
  var tblEl=document.getElementById('suppProductTbl');
  if(!tblEl)return;
  var title=isGM?'📋 รายได้ GM รายเดือนตามผลิตภัณฑ์':'📋 จำนวนคัน รายเดือนตามผลิตภัณฑ์';
  var th='<h2>'+title+'</h2><div style="overflow-x:auto"><table><tr><th>เดือน</th><th>รวม</th>';
  sortedProds.forEach(function(p){th+='<th>'+p+'</th>';});
  th+='</tr>';

  monthlyData.forEach(function(mo,i){
    if(!mo.month||mo.month==='')return;
    var byProd=mo.byProduct||{};
    var displayTotal=isGM?fmtB(mo.total||0):fmt(mo.total||0);
    th+='<tr><td><b>'+mo.month+'</b></td><td>'+displayTotal+'</td>';
    sortedProds.forEach(function(p){
      var v=byProd[p]||0;
      th+='<td>'+(v?fmtFunc(v):'-')+'</td>';
    });
    th+='</tr>';
  });

  // Totals row
  th+='<tr class="sub"><td><b>รวม</b></td><td><b>'+fmtFunc(totalVal)+'</b></td>';
  sortedProds.forEach(function(p){th+='<td><b>'+fmtFunc(totals[p]||0)+'</b></td>';});
  th+='</tr></table></div>';
  tblEl.innerHTML=th;
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ═══════════ KPI Brief Tab ═══════════ */
function renderBrief(){
  if(!D||!D.bct||!D.bct.bct){document.getElementById('p-brief').innerHTML='<div class="card"><h2>⚠️ ไม่มีข้อมูล KPI</h2></div>';return;}
  var bct=D.bct.bct;
  var fin=D.fin?D.fin.fin:null;
  var sa=D.sa;
  var ins=D.ins?D.ins.ins:null;
  var ch=D.ch?D.ch.ch:null;
  var sc=D.sc;
  var supp=D.supp;

  // Find latest month with actual data
  var idx=0;
  for(var i=bct.length-1;i>=0;i--){if(bct[i].ac>0){idx=i;break;}}

  var b=bct[idx];
  var f=fin?fin[idx]:null;
  var monthNames=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var mLabel=monthNames[idx]||'?';
  var today=new Date();
  var yr=today.getFullYear();
  var mo=today.getMonth()+1;
  var dy=today.getDate();
  function wdInMonthFn(y,m){var cnt=0;for(var d=1;d<=31;d++){var dt=new Date(y,m-1,d);if(dt.getMonth()!=m-1)break;if(dt.getDay()!=0)cnt++;}return cnt;}
  function wdPassedFn(y,m,d){var cnt=0;for(var dd=1;dd<=d;dd++){var dt=new Date(y,m-1,dd);if(dt.getDay()!=0)cnt++;}return cnt;}
  var wdT=wdInMonthFn(yr,mo);
  var wdP=wdPassedFn(yr,mo,dy);
  var wdR=wdT-wdP;
  var pctTime=wdT>0?Math.round(wdP/wdT*100):0;

  function thM(v){
    if(v>=1e6) return (v/1e6).toFixed(2)+'ล้าน';
    if(v>=1e5) return (v/1e5).toFixed(2)+'แสน';
    if(v>=1e4) return (v/1e4).toFixed(1)+'หมื่น';
    if(v>=1e3) return (v/1e3).toFixed(1)+'พัน';
    return Math.round(v)+'';
  }
  function pctCls(v){return v>=80?'good':(v>=50?'warn':'bad');}
  function pctFmt(cur,tgt){return tgt>0?Math.round(cur/tgt*1000)/10:0;}

  var h='';

  // ── Header ──
  h+='<div style="text-align:center;margin-bottom:14px">';
  h+='<div style="font-size:1.3rem;font-weight:800;color:#1e293b">📋 สรุปสั้น KPI ประจำเดือน</div>';
  h+='<div style="font-size:.85rem;color:#64748b;margin-top:2px">'+mLabel+' '+(new Date().getFullYear()+543)+' · ผ่านมา '+wdP+'/'+wdT+' วันทำงาน ('+pctTime+'%)</div>';
  h+='</div>';

  // ── 🚗 ปิดได้/ส่งมอบ ──
  h+='<div class="brief-section">';
  h+='<div class="brief-section-hdr"><span class="emoji">🚗</span> ปิดได้/ส่งมอบ</div>';
  var pctAc=pctFmt(b.ac,b.tc);
  var pctAd=pctFmt(b.ad,b.td);
  var pctCash=pctFmt(b.cashA,b.cashT);
  // Previous month for trend comparison
  var prevIdx=idx>0?idx-1:0;
  var bp=bct[prevIdx];
  var wdPrevMo=mo>1?mo-1:12;
  var wdPrevYr=mo>1?yr:yr-1;
  var wdPrev=wdInMonthFn(wdPrevYr,wdPrevMo);
  var avgAcNow=b.ac>0&&wdP>0?Math.round(b.ac/wdP*10)/10:0;
  var avgAcPrev=bp.ac>0&&wdPrev>0?Math.round(bp.ac/wdPrev*10)/10:0;
  var avgAdNow=b.ad>0&&wdP>0?Math.round(b.ad/wdP*10)/10:0;
  var avgAdPrev=bp.ad>0&&wdPrev>0?Math.round(bp.ad/wdPrev*10)/10:0;
  function trendPct(now,prev){if(!prev||prev==0)return '';var ch=Math.round((now-prev)/prev*100);return ch>=0?'<span style="color:#22c55e;font-size:.75rem"> (เฉลี่ย '+now+'/วัน '+ch+'%↗ vs เดือนก่อน)</span>':'<span style="color:#ef4444;font-size:.75rem"> (เฉลี่ย '+now+'/วัน '+ch+'%↘ vs เดือนก่อน)</span>';}

  h+='<div class="brief-kpi">';
  h+='<div class="brief-kpi-item"><span class="num">'+b.ac+'</span><span class="lbl">ปิดได้</span><span class="sub">/เป้า '+b.tc+' <span class="pct '+pctCls(pctAc)+'">'+pctAc+'%</span>'+trendPct(avgAcNow,avgAcPrev)+'</span></div>';
  h+='<div class="brief-kpi-item"><span class="num">'+b.ad+'</span><span class="lbl">ส่งมอบ</span><span class="sub">/เป้า '+b.td+' <span class="pct '+pctCls(pctAd)+'">'+pctAd+'%</span>'+trendPct(avgAdNow,avgAdPrev)+'</span></div>';
  h+='</div>';
  h+='<div class="brief-row"><div class="label">🚛 อีซูซุ</div><div class="value">'+b.isz+' คัน</div></div>';
  var carP=b.ad-b.isz-(b.sdn||0)-(b.big||0);
  h+='<div class="brief-row"><div class="label">🚙 รถเก๋ง</div><div class="value">'+carP+' คัน</div></div>';
  if(b.sdn) h+='<div class="brief-row"><div class="label">🛻 กระบะต่างยี่ห้อ</div><div class="value">'+b.sdn+' คัน</div></div>';
  h+='<div class="brief-row"><div class="label">💵 เงินสด</div><div class="value">'+b.cashA+'/'+b.cashT+' = <span class="pct '+pctCls(pctCash)+'">'+pctCash+'%</span></div></div>';
  h+='</div>';

  // ── 🔧 รับรถเข้าซ่อม ──
  if(sa&&sa.detail&&sa.detail.monthly&&sa.detail.monthly[idx]){
    var saData=sa.detail.monthly[idx].data;
    var recv=saData['การรับลูกค้า (จำนวนคัน)']||{};
    var totalRecv=0;
    var sortedRecv=[];
    for(var k in recv){if(recv[k]>0){totalRecv+=recv[k];sortedRecv.push([k,recv[k]]);}}
    sortedRecv.sort(function(a,b){return b[1]-a[1];});

    h+='<div class="brief-section">';
    h+='<div class="brief-section-hdr"><span class="emoji">🔧</span> รับรถเข้าซ่อม</div>';
    h+='<div class="brief-row" style="justify-content:center;font-weight:700;font-size:1rem;color:#3b82f6;padding:8px">รวม '+totalRecv+' คัน</div>';
    for(var ri=0;ri<sortedRecv.length;ri++){
      h+='<div class="brief-rank"><div class="rank">'+(ri+1)+'</div><div class="name">'+escHtml(sortedRecv[ri][0])+'</div><div class="val">'+sortedRecv[ri][1]+' คัน</div></div>';
    }
    h+='</div>';
  }

  // ── 💰 การเงิน ──
  if(f){
    var pctR=pctFmt(f.rA,f.rT);
    var laborP=b.ac?Math.round(f.sal/b.ac):0;
    var partsP=b.ac?Math.round(f.pts/b.ac):0;
    h+='<div class="brief-section">';
    h+='<div class="brief-section-hdr"><span class="emoji">💰</span> การเงิน</div>';
    h+='<div class="brief-row"><div class="label">รายได้</div><div class="value">'+thM(f.rA)+' / เป้า '+thM(f.rT)+' = <span class="pct '+pctCls(pctR)+'">'+pctR+'%</span></div></div>';
    h+='<div class="brief-row"><div class="label">🔧 ค่าแรง</div><div class="value">'+thM(f.sal)+'บาท</div></div>';
    h+='<div class="brief-row"><div class="label">🔩 ค่าอะไหล่</div><div class="value">'+thM(f.pts)+'บาท</div></div>';
    h+='<div class="brief-row"><div class="label">📈 กำไรขั้นต้น</div><div class="value">'+thM(f.gm)+'บาท</div></div>';
    h+='<div class="brief-row"><div class="label">👷 ค่าแรง/คัน</div><div class="value">'+laborP.toLocaleString()+' | ค่าอะไหล่/คัน: '+partsP.toLocaleString()+'</div></div>';
    h+='</div>';
  }

  // ── 📍 ช่องทาง ──
  if(ch){
    var importantNames=['ทีม AI','MR กู้ภัย','BYD','ตรวจเช็คคุณภาพสี'];
    var ranked=[];
    for(var ci=0;ci<ch.length;ci++){
      var cVal=ch[ci].monthly[idx]||0;
      ranked.push({name:ch[ci].name,val:cVal,origIdx:ci+1});
    }
    ranked.sort(function(a,b){return b.val-a.val;});

    h+='<div class="brief-section">';
    h+='<div class="brief-section-hdr"><span class="emoji">📍</span> ช่องทาง</div>';
    var shownImp={};
    var rank=1;
    for(var ri2=0;ri2<ranked.length;ri2++){
      var ch_item=ranked[ri2];
      var star=importantNames.indexOf(ch_item.name)>=0?'⭐':'';
      if(ch_item.val>0||star){
        h+='<div class="brief-rank"><div class="rank">'+rank+'</div><div class="name">'+escHtml(ch_item.name)+'</div><div class="val">'+ch_item.val+star+'</div></div>';
        rank++;
        if(star) shownImp[ch_item.name]=true;
      }
    }
    // Show missing important channels with 0
    for(var mi=0;mi<importantNames.length;mi++){
      if(!shownImp[importantNames[mi]]){
        h+='<div class="brief-rank"><div class="rank">-</div><div class="name">'+importantNames[mi]+'</div><div class="val">0⭐</div></div>';
      }
    }
    h+='</div>';
  }

  // ── 📢 เชียร์เคลม GM ──
  if(sc&&sc.saNames&&sc.saMonthly){
    var scNames=sc.saNames;
    var scMonth=sc.saMonthly;
    var scRanked=[];
    for(var si=0;si<scNames.length;si++){
      var sv=scMonth[si][idx]||0;
      if(sv>0) scRanked.push({name:scNames[si],val:sv});
    }
    scRanked.sort(function(a,b){return b.val-a.val;});
    if(scRanked.length>0){
      h+='<div class="brief-section">';
      h+='<div class="brief-section-hdr"><span class="emoji">📢</span> เชียร์เคลม GM</div>';
      for(var sj=0;sj<scRanked.length;sj++){
        h+='<div class="brief-rank"><div class="rank">'+(sj+1)+'</div><div class="name">'+escHtml(scRanked[sj].name)+'</div><div class="val">'+thM(scRanked[sj].val)+'</div></div>';
      }
      h+='</div>';
    }
  }

  // ── 🔧 ผลิตภัณฑ์เสริม ──
  if(supp&&supp.saMonthly&&supp.saMonthly[idx]){
    var suppM=supp.saMonthly[idx];
    var sPct=suppM.target>0?Math.round(suppM.achieved/suppM.target*1000)/10:0;
    h+='<div class="brief-section">';
    h+='<div class="brief-section-hdr"><span class="emoji">🔧</span> ผลิตภัณฑ์เสริม</div>';
    h+='<div class="brief-row"><div class="label">เป้า/ทำได้</div><div class="value">'+(suppM.target||0).toLocaleString()+' / '+(suppM.achieved||0).toLocaleString()+' = <span class="pct '+pctCls(sPct)+'">'+sPct+'%</span></div></div>';
    // Product breakdown
    if(supp.prodGMMonthly&&supp.prodGMMonthly[idx]){
      var prodGM=supp.prodGMMonthly[idx].byProduct;
      var sorted=Object.keys(prodGM).sort(function(a,b){return prodGM[b]-prodGM[a];});
      for(var pi=0;pi<sorted.length&&pi<8;pi++){
        h+='<div class="brief-product"><div class="pname">'+escHtml(sorted[pi])+'</div><div class="pval">'+thM(prodGM[sorted[pi]])+'บาท</div></div>';
      }
    }
    h+='</div>';
  }

  // ── 🚨 ประกันภัย ──
  if(ins){
    var insRanked=ins.slice().sort(function(a,b){return b.total-a.total;});
    h+='<div class="brief-section">';
    h+='<div class="brief-section-hdr"><span class="emoji">🚨</span> ประกันภัย Top 10</div>';
    for(var ii=0;ii<Math.min(10,insRanked.length);ii++){
      if(insRanked[ii].total>0){
        h+='<div class="brief-rank"><div class="rank">'+(ii+1)+'</div><div class="name">'+escHtml(insRanked[ii].name)+'</div><div class="val">'+insRanked[ii].total+' <span style="color:#94a3b8;font-size:.7rem">('+insRanked[ii].pct+'%)</span></div></div>';
      }
    }
    h+='</div>';
  }

  // ── 📈 rpC/spC ──
  if(f){
    var prevIdx=idx>0?idx-1:0;
    var pf=fin?fin[prevIdx]:f;
    var rpcNow=f.pts>0?(f.sal/f.pts):0;
    var rpcPrev=pf.pts>0?(pf.sal/pf.pts):0;
    var spcNow=f.sal>0?(f.pts/f.sal):0;
    var spcPrev=pf.sal>0?(pf.pts/pf.sal):0;
    h+='<div class="brief-section">';
    h+='<div class="brief-section-hdr"><span class="emoji">📈</span> rpC / spC</div>';
    h+='<div class="brief-row"><div class="label">rpC (แรง/อะไหล่)</div><div class="value">'+(rpcNow>=rpcPrev?'📈 ขึ้น=ดี':'📉 ลด=ระวัง')+'</div></div>';
    h+='<div class="brief-row"><div class="label">spC (อะไหล่/แรง)</div><div class="value">'+(spcNow>=spcPrev?'📈 ขึ้น=ดี':'📉 ลด=ระวัง')+'</div></div>';
    h+='</div>';
  }

  // ── 🏭 ส่งมอบรายคน ──
  if(sa&&sa.detail&&sa.detail.monthly&&sa.detail.monthly[idx]){
    var saData2=sa.detail.monthly[idx].data;
    var deliver=saData2['การส่งมอบ (จำนวนคัน)']||{};
    var deliverL=saData2['การส่งมอบ (ค่าแรง/คัน)']||{};
    var deliverP=saData2['การส่งมอบ (ค่าอะไหล่/คัน)']||{};
    var sortedD=[];
    for(var dk in deliver){if(deliver[dk]>0)sortedD.push({name:dk,val:deliver[dk],l:Math.round(deliverL[dk]||0),p:Math.round(deliverP[dk]||0)});}
    sortedD.sort(function(a,b){return b.val-a.val;});

    h+='<div class="brief-section">';
    h+='<div class="brief-section-hdr"><span class="emoji">🏭</span> ส่งมอบรายคน</div>';
    for(var di=0;di<sortedD.length;di++){
      h+='<div class="brief-rank"><div class="rank">'+(di+1)+'</div><div class="name">'+escHtml(sortedD[di].name)+'</div><div class="val">'+sortedD[di].val+' คัน</div><div class="extra">แรง '+sortedD[di].l.toLocaleString()+' | อะไหล่ '+sortedD[di].p.toLocaleString()+'</div></div>';
    }
    h+='</div>';
  }

  // ── 📊 วิเคราะห์แนวโน้มจบเดือน ──
  (function(){
    function fc(cur,wp,wt){return wp>0?Math.round(cur/wp*wt):0;}
    function sIcon(fc,tgt){if(fc>=tgt)return '✅';return fc>=tgt*0.8?'⚠️':'❌';}

    var fAc=fc(b.ac,wdP,wdT);
    var fAd=fc(b.ad,wdP,wdT);
    var fRecv=0;
    if(sa&&sa.detail&&sa.detail.monthly&&sa.detail.monthly[idx]){
      var rv=sa.detail.monthly[idx].data['การรับลูกค้า (จำนวนคัน)']||{};
      for(var rk in rv)fRecv+=rv[rk]||0;
    }
    var fRecvF=fc(fRecv,wdP,wdT);
    var fRA=f?fc(f.rA,wdP,wdT):0;
    var fGM=f?fc(f.gm,wdP,wdT):0;
    var fCash=fc(b.cashA,wdP,wdT);

    h+='<div class="brief-section" style="background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:1px solid #7dd3fc">';
    h+='<div class="brief-section-hdr" style="background:linear-gradient(135deg,#e0f2fe,#bae6fd);color:#0c4a6e"><span class="emoji">📊</span> วิเคราะห์แนวโน้มจบเดือน</div>';
    h+='<div class="brief-row" style="color:#0369a1"><div class="label">📅 ผ่านมา</div><div class="value">'+wdP+'/'+wdT+' วันทำงาน ('+pctTime+'%) เหลือ '+wdR+' วัน</div></div>';
    h+='<div class="brief-row" style="color:#0f172a;border-top:1px solid #bae6fd;padding-top:8px;margin-top:4px"><div class="label" style="font-weight:700">การวัดผล</div><div class="value" style="font-weight:700">ทำได้ → พยากรณ์จบเดือน (เป้า)</div></div>';

    h+='<div class="brief-row"><div class="label">🚗 ปิดได้</div><div class="value">'+b.ac+' → <b>'+fAc+'</b> '+sIcon(fAc,b.tc)+' (เป้า '+b.tc+')</div></div>';
    h+='<div class="brief-row"><div class="label">🚛 ส่งมอบ</div><div class="value">'+b.ad+' → <b>'+fAd+'</b> '+sIcon(fAd,b.td)+' (เป้า '+b.td+')</div></div>';
    h+='<div class="brief-row"><div class="label">🔧 รับรถ</div><div class="value">'+fRecv+' → <b>'+fRecvF+'</b></div></div>';
    if(f){
      h+='<div class="brief-row"><div class="label">💰 รายได้</div><div class="value">'+thM(f.rA)+' → <b>'+thM(fRA)+'</b> '+sIcon(fRA,f.rT)+' (เป้า '+thM(f.rT)+')</div></div>';
      h+='<div class="brief-row"><div class="label">📈 กำไรขั้นต้น</div><div class="value">'+thM(f.gm)+' → <b>'+thM(fGM)+'</b></div></div>';
    }
    h+='<div class="brief-row"><div class="label">💵 เงินสด</div><div class="value">'+b.cashA+'/'+b.cashT+' → <b>'+fCash+'</b> '+sIcon(fCash,b.cashT)+' (เป้า '+b.cashT+')</div></div>';
    h+='</div>';
  })();

  // Refresh buttons for brief
  h+='<div style="text-align:center;margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">';
  h+='<button style="padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;border:1.5px solid #0891b2;background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;box-shadow:0 2px 8px rgba(8,145,178,.3)" onclick="refreshAllData()">🔄 รีเฟรชข้อมูลทั้งหมด</button>';
  h+='<button style="padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;border:1.5px solid #64748b;background:#fff;color:#64748b;box-shadow:0 1px 3px rgba(0,0,0,.05)" onclick="refreshBriefOnly()">📊 รีเฟรช KPI เท่านั้น</button>';
  h+='</div>';

  document.getElementById('p-brief').innerHTML=h;
}

function loadCalendarData(){
  google.script.run
    .withSuccessHandler(function(r){
      D.cal=r;
      renderSummary();
    })
    .withFailureHandler(function(e){
      showErr('ปฏิทินสรุป: '+e.message);
    })
    .getCalendarData();
}

function refreshAllData(){
  var el=document.getElementById('loadMsg');
  if(el){
    el.style.display='block';
    el.innerHTML='<div style="font-size:18px;margin-bottom:8px">🔄 กำลังรีเฟรชข้อมูล...</div><div style="font-size:13px;color:#94a3b8">กรุณารอสักครู่</div>';
  }
  // Switch to dashboard tab to show loading
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  var dashTab=document.querySelector('.tab[data-p="dash"]');
  var dashPanel=document.getElementById('p-dash');
  if(dashTab)dashTab.classList.add('active');
  if(dashPanel)dashPanel.classList.add('active');
  if(dashPanel)dashPanel.innerHTML='<div class="loading" id="loadMsg"><div style="font-size:18px;margin-bottom:8px">🔄 กำลังรีเฟรชข้อมูล...</div><div style="font-size:13px;color:#94a3b8">กรุณารอสักครู่</div></div>';
  // Reset D and reload
  D={};
  loadData();
}

function refreshSummaryOnly(){
  var el=document.getElementById('p-summary');
  if(el)el.innerHTML='<div style="text-align:center;padding:40px 0"><div style="font-size:18px;margin-bottom:8px">🔄 กำลังรีเฟรชปฏิทิน...</div><div style="font-size:13px;color:#94a3b8">กรุณารอสักครู่</div></div>';
  google.script.run
    .withSuccessHandler(function(r){
      D.cal=r;
      renderSummary();
    })
    .withFailureHandler(function(e){
      showErr('ปฏิทินสรุป: '+e.message);
    })
    .getCalendarData();
}

function refreshBriefOnly(){
  var el=document.getElementById('p-brief');
  if(el)el.innerHTML='<div style="text-align:center;padding:40px 0"><div style="font-size:18px;margin-bottom:8px">🔄 กำลังรีเฟรช KPI...</div><div style="font-size:13px;color:#94a3b8">กรุณารอสักครู่</div></div>';
  // Reload the main KPI data
  var fns=['getOKRData','getBCTData','getFinData','getInsData','getChData','getSAData','getShareClaimData','getYoYData','getDTAData','getHistoricalData','getRepairTypeData','getServiceMixData','getSupplementData','getMonitorData','getGlassData','getInsuranceComparison'];
  var keys=['okr','bct','fin','ins','ch','sa','sc','yoy','dta','hist','rtype','smix','supp','monitor','glass','insComp'];
  var count=0;
  var total=fns.length;
  for(var i=0;i<fns.length;i++){
    (function(idx){
      google.script.run
        .withSuccessHandler(function(r){
          D[keys[idx]]=r;
          count++;
          if(count===total)renderBrief();
        })
        .withFailureHandler(function(e){
          count++;
          if(count===total)renderBrief();
        })[fns[idx]]();
    })(i);
  }
}


</script>
</body>
