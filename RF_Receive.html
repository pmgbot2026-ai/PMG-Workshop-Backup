<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚗 รับรถเข้าซ่อม</title>
<style>
:root{--bg:#f0f4f8;--card:#fff;--accent:#2563eb;--accent2:#7c3aed;--green:#059669;--red:#dc2626;--text:#1e293b;--text2:#475569;--text3:#94a3b8;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding-bottom:40px}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.header h1{font-size:18px;color:#fff;display:flex;align-items:center;gap:6px}
.header .sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.content{padding:12px 16px}
.section{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.section h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8fafc;padding:8px 6px;text-align:left;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--border);vertical-align:top}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.blue{background:#dbeafe;color:var(--accent)}
.badge.green{background:#d1fae5;color:var(--green)}
.badge.gray{background:#f1f5f9;color:#64748b}
.loading{text-align:center;padding:40px;color:var(--text3)}
.empty{text-align:center;padding:40px;color:var(--text3)}
</style>
</head>
<body>
<div style="position:fixed;top:8px;right:8px;z-index:99999;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(220,38,38,0.3);cursor:default;font-family:system-ui,sans-serif;letter-spacing:0.3px" title="ข้อมูลส่วนบุคคล PDPA — ห้ามส่งออกหรือเผยแพร่โดยไม่ได้รับอนุญาต">🔒 ข้อมูลลับ PDPA</div>
<div class="header">
<h1>🚗 รับรถเข้าซ่อม</h1>
<div class="sub" id="branchLabel">—</div>
</div>
<div class="content" id="content">
<div class="loading">กำลังโหลด...</div>
</div>
<script>
var SCRIPT_URL = 'SCRIPT_URL_PLACEHOLDER';
var currentBranch = 'cnb';

function init() {
  var params = new URLSearchParams(window.location.search);
  currentBranch = params.get('branch') || 'cnb';
  document.getElementById('branchLabel').textContent = currentBranch === 'cnb' ? 'มหาราช (CNB)' : 'ซีเอสเค (CSK)';
  loadVehicles();
}

function loadVehicles() {
  fetch(SCRIPT_URL + '?rf=1&action=getVehicles&data=' + encodeURIComponent(JSON.stringify({branch: currentBranch}))
  ).then(function(r) { return r.json(); }).then(function(r) {
    if (r.success) {
      renderVehicles(r.vehicles || []);
    } else {
      document.getElementById('content').innerHTML = '<div class="empty">❌ ' + esc(r.error||'error') + '</div>';
    }
  }).catch(function(e) {
    document.getElementById('content').innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>';
  });
}

function renderVehicles(vehicles) {
  var html = '<div class="section"><h3>📋 รถที่รับเข้ามา (' + vehicles.length + ' คัน)</h3>';
  html += '<p style="font-size:12px;color:var(--text3);margin-bottom:8px">ข้อมูลดึงจากชีท B2 ของสาขา — รถที่ส่งมอบแล้วจะไม่แสดง</p>';
  if (vehicles.length === 0) {
    html += '<div class="empty">ไม่มีรถที่อยู่ระหว่างซ่อม</div>';
  } else {
    html += '<div style="overflow-x:auto"><table><thead><tr><th>ทะเบียน</th><th>สถานะ</th><th>SA</th><th>ยี่ห้อ</th><th>ประกัน</th><th>วันรับ</th><th>อายุ(วัน)</th></tr></thead><tbody>';
    vehicles.forEach(function(v) {
      html += '<tr>';
      html += '<td><b>' + esc(v.plate) + '</b></td>';
      html += '<td><span class="badge blue">' + esc(v.status) + '</span></td>';
      html += '<td>' + esc(v.sa) + '</td>';
      html += '<td>' + esc(v.brand) + ' ' + esc(v.model||'') + '</td>';
      html += '<td>' + esc(v.insurer) + '</td>';
      html += '<td>' + esc(v.repairDate) + '</td>';
      html += '<td>' + (v.totalDays||0) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  html += '<div class="section"><h3>ℹ️ ขั้นตอนถัดไป</h3>';
  html += '<p style="font-size:13px;color:var(--text2)">หัวหน้าโรงซ่อมไปที่ <a href="' + SCRIPT_URL + '?rf=1&view=plan&branch=' + currentBranch + '" style="color:var(--accent)">📋 วางแผนซ่อม</a> เพื่อเลือกสถานีและจ่ายงานให้ช่าง</p>';
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function esc(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
</body>
</html>
